<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COFFEE EQUIPMENTS | Micro UAE</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f2e9;color:#1b251e;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#18241d;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px}header b{font:700 24px Georgia,serif}button{cursor:pointer;font:inherit}#toggle{border:0;background:#c69b65;border-radius:22px;padding:9px 14px;font-weight:700}main{max-width:1100px;margin:auto;padding:30px 18px 65px}h1{font-size:clamp(28px,5vw,44px)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.tile{display:block;background:#fff;border:1px solid #e3ded3;border-radius:20px;overflow:hidden;color:inherit;text-decoration:none}.tile .image{height:300px;background:#faf3eb;padding:15px;display:grid;place-items:center}.tile img{height:100%;width:100%;object-fit:contain}.tile h2{text-align:center;padding:15px;font-size:22px}.back{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:white;border:1px solid #d8cbb6;color:#1b251e;text-decoration:none}.back svg{width:23px;height:23px}.bottom{text-align:center;margin-top:35px}@media(max-width:600px){.grid{gap:12px}.tile .image{height:190px}.tile h2{font-size:17px;padding:12px}}@media(max-width:380px){.grid{grid-template-columns:1fr}.tile .image{height:250px}}</style></head><body><header><b>MICRO UAE</b><button id="toggle">العربية</button></header><main><a class="back" href="index.html" aria-label="Back to home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a><h1 id="title">COFFEE EQUIPMENTS</h1><div class="grid"><a class="tile" href="filters.html"><div class="image"><img src="A4E898D8-4A12-4782-B1FB-1E2938992C0F.png" alt="Coffee filters"></div><h2 data-en="FILTERS" data-ar="الفلاتر">FILTERS</h2></a><a class="tile" href="tools.html"><div class="image"><img src="8D0158FB-81B5-4413-B0A0-B49B3DEDED8F.png" alt="Coffee tools"></div><h2 data-en="TOOLS" data-ar="الأدوات">TOOLS</h2></a></div><div class="bottom"><a class="back" href="index.html" aria-label="Back to home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a></div></main><script>let lang=localStorage.getItem('micro-uae-lang')==='ar'?'ar':'en';function apply(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('toggle').textContent=lang==='ar'?'English':'العربية';document.getElementById('title').textContent=lang==='ar'?'معدات القهوة':'COFFEE EQUIPMENTS';document.querySelectorAll('[data-en]').forEach(el=>el.textContent=el.dataset[lang]);document.querySelectorAll('.back').forEach(el=>el.setAttribute('aria-label',lang==='ar'?'العودة للرئيسية':'Back to home'))}document.getElementById('toggle').onclick=()=>{lang=lang==='en'?'ar':'en';localStorage.setItem('micro-uae-lang',lang);apply()};apply();</script></body></html>
