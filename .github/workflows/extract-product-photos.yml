name: Extract uploaded product photos
on:
  push:
    paths:
      - 'Micro_UAE_17_Organized_Photos.zip'
      - '.github/workflows/extract-product-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract photos into site assets
        run: |
          mkdir -p images/new-products
          unzip -o Micro_UAE_17_Organized_Photos.zip -d images/new-products
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/new-products
          if ! git diff --cached --quiet; then
            git commit -m "Extract 17 product images for Micro UAE storefront"
            git push
          fi
