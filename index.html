<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1128"><title>ASTRA DRIFT — Arcade Adventure</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d20;color:#f4f7ff;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer}#app{position:relative;width:100%;height:100dvh;max-width:620px;margin:auto;overflow:hidden;background:#090d20}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;padding:14px 17px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;z-index:3}#hud.hidden{display:none}.pill{background:#101c3cc9;border:1px solid #4d6699a6;backdrop-filter:blur(8px);border-radius:17px;padding:8px 12px;font-size:13px;font-weight:900;box-shadow:0 5px 20px #0004}.pill small{display:block;color:#9aafd6;font-size:9px;letter-spacing:1px}.hud-right{display:flex;gap:7px;align-items:center}.hud-right button{pointer-events:auto;border:1px solid #6375a1;background:#152448de;color:white;border-radius:14px;padding:9px 12px;font-size:18px}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(180deg,#070d25c7,#080c20ec);z-index:5;overflow-y:auto}.overlay.hidden{display:none}.panel{width:100%;max-width:410px;background:linear-gradient(155deg,#182b53f5,#131a3bf5);border:1px solid #6c81b96b;border-radius:28px;padding:25px 21px;text-align:center;box-shadow:0 25px 70px #0009, inset 0 1px #ffffff23}.eyebrow{font-size:11px;font-weight:900;letter-spacing:3px;color:#8de4e8}.logo{font-size:clamp(33px,9vw,49px);line-height:1.02;font-weight:1000;letter-spacing:-2px;margin:10px 0 7px;background:linear-gradient(95deg,#fef5d4,#77e7ee,#ba9dff);background-clip:text;color:transparent}.desc{font-size:13px;color:#bbcae9;line-height:1.6;margin:9px 0 20px}.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px 13px;margin:9px 0;font-weight:1000;color:#132341;background:linear-gradient(100deg,#77f2e0,#89bfff);box-shadow:0 5px 0 #427a9c;font-size:16px}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #427a9c}.btn.secondary{background:#25385e;color:#eaf1ff;box-shadow:none;border:1px solid #5a6c99}.row{display:flex;gap:9px}.row .btn{flex:1;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}.stat{border:1px solid #5c75a45c;border-radius:13px;padding:10px 3px;background:#102243}.stat strong{display:block;font-size:19px;color:#fce9b2}.stat span{font-size:10px;color:#b2c3e1}.shop{display:grid;gap:8px;text-align:left;margin:13px 0}.upgrade{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#17294b;border:1px solid #5271998f;padding:11px;border-radius:15px;color:#eaf3ff}.upgrade b{font-size:12px}.upgrade small{display:block;color:#a5bada;font-size:10px;margin-top:3px}.upgrade button{white-space:nowrap;background:#f8d28e;border:0;border-radius:10px;padding:9px;font-weight:900;color:#342a3e;font-size:12px}.upgrade button:disabled{opacity:.45}.tip{font-size:11px;color:#8eb8d2;line-height:1.6}.tiny{font-size:11px;color:#c8d5ee}.title-icon{font-size:48px;filter:drop-shadow(0 0 18px #71f5f7)}#banner{position:absolute;top:21%;left:50%;transform:translateX(-50%);font-size:24px;font-weight:1000;white-space:nowrap;text-shadow:0 3px 16px #07132d;opacity:0;transition:opacity .2s;z-index:4;pointer-events:none}#banner.show{opacity:1}#control{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);left:50%;transform:translateX(-50%);z-index:3;background:#142346a8;border:1px solid #5571a68c;border-radius:40px;padding:8px 20px;font-size:12px;font-weight:850;color:#d8eaff;pointer-events:none}#control.hidden{display:none}@media(max-height:690px){.panel{padding:17px}.desc{margin:5px 0 11px}.stats{margin:9px 0}.logo{font-size:35px}.overlay{padding:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main id="app"><canvas id="game" aria-label="Astra Drift arcade game"></canvas><div id="hud" class="hidden"><div class="pill"><small id="scoreLabel">SCORE</small><span id="score">0</span></div><div class="pill"><small id="sectorLabel">SECTOR 1</small><span id="lives">❤❤❤</span></div><div class="hud-right"><div class="pill">✦ <span id="runCoins">0</span></div><button id="pauseBtn" aria-label="Pause">Ⅱ</button></div></div><div id="banner"></div><div id="control" class="hidden">↔ DRAG TO STEER • COLLECT STARS</div><section id="overlay" class="overlay"><div class="panel" id="panel"></div></section></main><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id),overlay=$('overlay'),panel=$('panel');const KEY='astra-drift-save-v1';let data={bank:0,best:0,games:0,shield:0,magnet:0,bonus:0,lang:'en',sound:true};try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&typeof d==='object')data={...data,...d}}catch(e){}const tr=(en,ar)=>data.lang==='ar'?ar:en;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};let W=390,H=780,dpr=1,mode='menu',last=0,elapsed=0,score=0,runCoins=0,lives=3,sector=1,invuln=0,shieldCharges=0,spawn=0,objects=[],particles=[],stars=[],player={x:195,y:660,r:17},dragging=false,flash=0,shake=0,notice='',noticeTime=0,audio=null,missionTarget=30;const rand=(a,b)=>a+Math.random()*(b-a);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function beep(freq=520,duration=.09,type='sine'){if(!data.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}function resize(){const r=canvas.getBoundingClientRect();W=r.width||390;H=r.height||780;dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);player.y=H*.78;player.x=clamp(player.x,28,W-28);if(!stars.length)stars=Array.from({length:85},()=>({x:rand(0,W),y:rand(0,H),r:rand(.5,2),speed:rand(10,60)}))}window.addEventListener('resize',resize);resize();function show(html){overlay.classList.remove('hidden');panel.innerHTML=html}function hide(){overlay.classList.add('hidden')}function btn(label,fn,secondary=false){return '<button class="btn'+(secondary?' secondary':'')+'" data-action="'+fn+'">'+label+'</button>'}function menu(){mode='menu';$('hud').classList.add('hidden');$('control').classList.add('hidden');show('<div class="title-icon">✦</div><div class="eyebrow">A NEW ARCADE ADVENTURE</div><div class="logo">ASTRA<br>DRIFT</div><div class="desc">'+tr('Pilot a glowing starship through a shifting cosmic highway. Dodge hazards, grab starlight, survive increasingly wild sectors.','قد مركبتك الفضائية في طريق كوني متغير. تفادَ العقبات، واجمع النجوم، واصمد في مراحل تزداد صعوبة.')+'</div><div class="stats"><div class="stat"><strong>'+data.best+'</strong><span>'+tr('BEST SCORE','أفضل نتيجة')+'</span></div><div class="stat"><strong>✦ '+data.bank+'</strong><span>'+tr('STAR BANK','رصيد النجوم')+'</span></div><div class="stat"><strong>'+data.games+'</strong><span>'+tr('FLIGHTS','الرحلات')+'</span></div></div>'+btn(tr('▶ START FLIGHT','▶ ابدأ الرحلة'),'start')+btn(tr('✦ SHIP UPGRADES','✦ تطوير المركبة'),'shop',true)+'<div class="row">'+btn(data.lang==='en'?'العربية':'English','lang',true)+btn(data.sound?'🔊 '+tr('Sound','الصوت'):'🔇 '+tr('Muted','صامت'),'sound',true)+'</div><div class="tip">'+tr('Drag anywhere to steer. Every 30 stars earns a bonus. Progress is saved on this device.','اسحب بإصبعك لتحريك المركبة. كل 30 نجمة تمنحك مكافأة. يتم حفظ التقدم على هذا الجهاز.')+'</div>')}function shop(){mode='shop';const items=[['shield','🛡️ '+tr('Extra Shield','درع إضافي'),tr('Start each run with more protection','حماية إضافية في بداية كل رحلة')],['magnet','🧲 '+tr('Star Magnet','مغناطيس النجوم'),tr('Collect stars from farther away','اجمع النجوم من مسافة أبعد')],['bonus','⚡ '+tr('Star Bonus','مضاعف النجوم'),tr('Earn more stars per pickup','اكسب نجوماً أكثر لكل نجمة')]];let html='<div class="eyebrow">'+tr('SHIP HANGAR','حظيرة المركبات')+'</div><div class="logo" style="font-size:32px">'+tr('UPGRADES','التطويرات')+'</div><div class="desc">✦ '+data.bank+' '+tr('available stars','نجمة متاحة')+'</div><div class="shop">';items.forEach(([key,name,desc])=>{const lv=clamp(data[key]||0,0,3),cost=20*(lv+1)*(lv+1);html+='<div class="upgrade"><div><b>'+name+' · '+lv+'/3</b><small>'+desc+'</small></div><button data-action="buy-'+key+'" '+(lv>=3||data.bank<cost?'disabled':'')+'>'+(lv>=3?tr('MAX','مكتمل'):'✦ '+cost)+'</button></div>'});html+='</div>'+btn(tr('← BACK','← رجوع'),'menu',true);show(html)}function start(){mode='play';hide();$('hud').classList.remove('hidden');$('control').classList.remove('hidden');elapsed=0;score=0;runCoins=0;lives=3;sector=1;invuln=1.5;shieldCharges=data.shield;spawn=.6;objects=[];particles=[];flash=0;shake=0;missionTarget=30;player.x=W/2;player.y=H*.78;updateHud();banner(tr('SECTOR 1','المرحلة 1'));beep(670,.13)}function updateHud(){$('score').textContent=score;$('scoreLabel').textContent=tr('SCORE','النقاط');$('sectorLabel').textContent=tr('SECTOR ','المرحلة ')+sector;$('lives').textContent='❤'.repeat(Math.max(0,lives))+(shieldCharges?' 🛡️'+shieldCharges:'');$('runCoins').textContent=runCoins}function banner(t){$('banner').textContent=t;$('banner').classList.add('show');noticeTime=1.5}function pause(){if(mode!=='play')return;mode='paused';show('<div class="title-icon">Ⅱ</div><div class="logo" style="font-size:35px">'+tr('PAUSED','إيقاف مؤقت')+'</div><div class="desc">'+tr('Your starship is safe while paused.','مركبتك بأمان أثناء الإيقاف.')+'</div>'+btn(tr('▶ RESUME','▶ متابعة'),'resume')+btn(tr('↩ MAIN MENU','↩ القائمة الرئيسية'),'quit',true))}function finish(){mode='over';data.games++;data.bank+=runCoins;data.best=Math.max(data.best,score);save();$('control').classList.add('hidden');$('hud').classList.add('hidden');show('<div class="title-icon">🌠</div><div class="eyebrow">'+tr('FLIGHT COMPLETE','انتهت الرحلة')+'</div><div class="logo" style="font-size:35px">'+tr('NICE RUN!','رحلة رائعة!')+'</div><div class="stats"><div class="stat"><strong>'+score+'</strong><span>'+tr('SCORE','النقاط')+'</span></div><div class="stat"><strong>✦ '+runCoins+'</strong><span>'+tr('EARNED','المكتسب')+'</span></div><div class="stat"><strong>'+sector+'</strong><span>'+tr('SECTOR','المرحلة')+'</span></div></div><div class="desc">'+tr('Your collected stars are now in the ship bank. Upgrade and fly again!','نجومك انضافت لرصيد المركبة. طورها وحاول مرة ثانية!')+'</div>'+btn(tr('↻ PLAY AGAIN','↻ العب مرة ثانية'),'start')+btn(tr('✦ UPGRADES','✦ التطويرات'),'shop',true)+btn(tr('⌂ MAIN MENU','⌂ الرئيسية'),'menu',true));beep(230,.28,'triangle')}panel.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='start')start();else if(a==='menu'||a==='quit')menu();else if(a==='shop')shop();else if(a==='resume'){mode='play';hide()}else if(a==='lang'){data.lang=data.lang==='en'?'ar':'en';save();menu()}else if(a==='sound'){data.sound=!data.sound;save();menu()}else if(a.startsWith('buy-')){const k=a.slice(4),lv=clamp(data[k]||0,0,3),cost=20*(lv+1)*(lv+1);if(lv<3&&data.bank>=cost){data.bank-=cost;data[k]=lv+1;save();beep(750,.12);shop()}}});$('pauseBtn').onclick=pause;function point(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{if(mode!=='play')return;dragging=true;player.x=clamp(point(e).x,22,W-22);try{canvas.setPointerCapture(e.pointerId)}catch(_){}});canvas.addEventListener('pointermove',e=>{if(dragging&&mode==='play')player.x=clamp(point(e).x,22,W-22)});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);window.addEventListener('keydown',e=>{if(mode==='play'&&(e.key==='ArrowLeft'||e.key==='a'))player.x=clamp(player.x-32,22,W-22);if(mode==='play'&&(e.key==='ArrowRight'||e.key==='d'))player.x=clamp(player.x+32,22,W-22);if(e.key==='Escape'){if(mode==='play')pause();else if(mode==='paused'){mode='play';hide()}}});function burst(x,y,color,count=12){for(let i=0;i<count;i++)particles.push({x,y,vx:rand(-145,145),vy:rand(-145,145),life:rand(.35,.75),max:.75,color,r:rand(2,5)})}function spawnObject(){const hazard=Math.random()<Math.min(.58,.29+sector*.045);const x=rand(31,W-31);objects.push({x,y:-45,type:hazard?'rock':Math.random()<.13?'heart':'star',r:hazard?rand(16,25):14,spin:rand(0,6),speed:rand(0,55)});if(sector>=3&&Math.random()<.19)objects.push({x:clamp(x+rand(-100,100),28,W-28),y:-105,type:'rock',r:rand(15,23),spin:rand(0,6),speed:rand(0,55)})}function step(dt){elapsed+=dt;invuln=Math.max(0,invuln-dt);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt);const newSector=clamp(1+Math.floor(elapsed/24),1,9);if(newSector!==sector){sector=newSector;banner(tr('SECTOR ','المرحلة ')+sector+' ⚡');beep(820,.2);updateHud()}spawn-=dt;if(spawn<=0){spawnObject();spawn=Math.max(.28,.88-sector*.065)*rand(.78,1.18)}const speed=170+sector*27;for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.y+=(speed+o.speed)*dt;o.spin+=dt*2;if(o.y>H+45){objects.splice(i,1);continue}const dist=Math.hypot(o.x-player.x,o.y-player.y);if(o.type==='star'&&data.magnet&&dist<55+data.magnet*22){o.x+=(player.x-o.x)*Math.min(1,dt*6);o.y+=(player.y-o.y)*Math.min(1,dt*6)}if(dist<o.r+player.r-5){objects.splice(i,1);if(o.type==='rock'){if(invuln>0)continue;if(shieldCharges>0){shieldCharges--;banner(tr('SHIELD SAVED YOU!','الدرع حماك!'))}else{lives--;flash=.25;shake=.3;banner(tr('OUCH!','انتبه!'))}invuln=1.6;burst(o.x,o.y,'#ff748e',18);beep(180,.18,'sawtooth');updateHud();if(lives<=0){finish();return}}else if(o.type==='heart'){lives=Math.min(5,lives+1);burst(o.x,o.y,'#ff8ca8',12);beep(690,.15);updateHud()}else{const gain=1+data.bonus;runCoins+=gain;score+=10*gain+sector;burst(o.x,o.y,'#ffe6a2',9);beep(540+Math.min(400,runCoins*6),.055);if(runCoins>=missionTarget){runCoins+=10;missionTarget+=30;banner(tr('STAR BONUS +10!','مكافأة نجوم +10!'))}updateHud()}}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.98;p.vy*=.98;if(p.life<=0)particles.splice(i,1)}score+=Math.floor(dt*15);updateHud()}function drawShip(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);if(invuln>0&&mode==='play'&&Math.floor(elapsed*13)%2===0)ctx.globalAlpha=.48;ctx.shadowBlur=24;ctx.shadowColor='#60f3ef';ctx.fillStyle='#65d9f0';ctx.beginPath();ctx.moveTo(0,-27);ctx.lineTo(19,18);ctx.lineTo(6,11);ctx.lineTo(0,17);ctx.lineTo(-6,11);ctx.lineTo(-19,18);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#142f58';ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(8,7);ctx.lineTo(-8,7);ctx.closePath();ctx.fill();ctx.fillStyle='#fff2c1';ctx.beginPath();ctx.ellipse(0,-5,4,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff9d77';ctx.beginPath();ctx.moveTo(-8,16);ctx.lineTo(-4,16+rand(9,20));ctx.lineTo(0,16);ctx.lineTo(4,16+rand(9,20));ctx.lineTo(8,16);ctx.fill();if(shieldCharges>0){ctx.strokeStyle='#a2fff4';ctx.lineWidth=2;ctx.globalAlpha=.65;ctx.beginPath();ctx.arc(0,0,33,0,Math.PI*2);ctx.stroke()}ctx.restore()}function draw(t){ctx.clearRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate(rand(-5,5),rand(-5,5));const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0a1638');bg.addColorStop(.5,'#171d46');bg.addColorStop(1,'#321b52');ctx.fillStyle=bg;ctx.fillRect(-10,-10,W+20,H+20);ctx.globalAlpha=.17;ctx.fillStyle='#956df6';ctx.beginPath();ctx.ellipse(W*.8,H*.3,125,260,-.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4bc9d2';ctx.beginPath();ctx.ellipse(W*.13,H*.73,90,240,.3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;for(const s of stars){const yy=(s.y+t*s.speed*.024)%H;ctx.fillStyle='rgba(209,240,255,'+(.35+.5*Math.sin(t*.001+s.x))+')';ctx.beginPath();ctx.arc(s.x,yy,s.r,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='#62bce627';ctx.lineWidth=1;const shift=t*.045%68;for(let x=W*.15;x<W;x+=W*.35){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=-68+shift;y<H;y+=68){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}if(mode==='play'||mode==='paused'){for(const o of objects){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.spin);if(o.type==='star'){ctx.shadowColor='#ffdf85';ctx.shadowBlur=20;ctx.fillStyle='#ffe7a4';ctx.beginPath();for(let j=0;j<10;j++){const a=j*Math.PI/5-Math.PI/2,r=j%2?7:17;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill()}else if(o.type==='heart'){ctx.font='30px system-ui';ctx.textAlign='center';ctx.fillText('❤',0,10)}else{ctx.shadowColor='#ff5d8c';ctx.shadowBlur=14;ctx.fillStyle='#5e3b74';ctx.strokeStyle='#ff728e';ctx.lineWidth=3;ctx.beginPath();for(let j=0;j<8;j++){const a=j*Math.PI/4,r=o.r*(j%2?.8:1);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-8,-4);ctx.lineTo(5,8);ctx.moveTo(5,-10);ctx.lineTo(10,0);ctx.stroke()}ctx.restore()}drawShip(player.x,player.y);for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.r,p.r)}ctx.globalAlpha=1;if(flash>0){ctx.fillStyle='#ff597a55';ctx.fillRect(0,0,W,H)}}else{drawShip(W/2,H*.59,1.8)}ctx.restore()}function frame(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;if(mode==='play')step(dt);draw(t);if(noticeTime>0){noticeTime-=dt;if(noticeTime<=0)$('banner').classList.remove('show')}requestAnimationFrame(frame)}menu();requestAnimationFrame(frame)})();
</script></body></html>
