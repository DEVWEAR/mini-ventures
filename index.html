<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Microsoft Digital Literacy Exam</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Arial;background:#f2f5fa;color:#14213b;margin:0}main{max-width:760px;margin:25px auto;padding:16px}.panel{background:white;border-radius:18px;padding:25px;box-shadow:0 6px 28px #1b365114}h1{font-size:27px}h2{font-size:21px;line-height:1.5}.muted{color:#65758b}.bar{height:9px;background:#e5eaf2;border-radius:12px;overflow:hidden}.fill{height:100%;background:#1967d2;transition:.2s}.option{display:block;width:100%;padding:16px;margin:12px 0;text-align:left;border:2px solid #dfe5ef;border-radius:12px;background:white;font-size:16px;cursor:pointer;color:#14213b}.option.selected{border-color:#1967d2;background:#eaf2ff}.btn{background:#1967d2;color:white;border:0;border-radius:10px;padding:13px 22px;font-size:16px;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.review{padding:15px;border-bottom:1px solid #ddd;line-height:1.5}.right{color:#137647}.wrong{color:#b42318}select{padding:12px;border-radius:9px;border:1px solid #ccd5e2;max-width:100%}</style></head><body><main><div class="panel" id="app"><h1>Microsoft Digital Literacy Quiz</h1><p>57 original questions across 6 modules.</p><p>Open this file in Safari to start the interactive test. If you are viewing it in an iPhone file preview, choose Share → Open in Safari.</p><p>JavaScript is required for automatic grading.</p></div></main><script>const all=[{"q": "Which of these devices is not a computer?", "options": ["A desktop", "A laptop", "A tablet", "A monitor"], "correct": 3, "slide": 5, "module": "Work with computers"}, {"q": "Which of the following parts of a computer is considered as input device?", "options": ["Speakers", "Screen", "Keyboard", "Motherboard"], "correct": 2, "slide": 7, "module": "Work with computers"}, {"q": "Harold needs to purchase a computer as they’re starting university. What they want is a computer with a built-in keyboard to type their lecture notes, and to work on their assignments at home. They’ll also need various applications and programs installed on the computer to complete their assignments. What is the best type of computer for their needs?", "options": ["A desktop", "A laptop", "A tablet", "A smartphone"], "correct": 1, "slide": 9, "module": "Work with computers"}, {"q": "Which of these functions is a task of an operating system?", "options": ["Managing computer hardware", "Showing the user the working area", "Allowing the user to type", "Allowing the user to interact with the screen"], "correct": 0, "slide": 17, "module": "Work with computers"}, {"q": "An operating system is the most important ___________ on the computer.", "options": ["Hardware", "Software", "Peripheral device", "Application"], "correct": 1, "slide": 19, "module": "Work with computers"}, {"q": "What happens when you select the \"Minimize\" button at the top of an application window?", "options": ["The window closes", "The window hides until restored", "The window goes full screen", "The window moves to the side of the screen"], "correct": 1, "slide": 21, "module": "Work with computers"}, {"q": "In Windows 10, which menu of the Settings app manages the accessibility settings?", "options": ["Devices", "Network and Internet", "Ease of Access", "Privacy"], "correct": 2, "slide": 23, "module": "Work with computers"}, {"q": "Which one is an operating system?", "options": ["Notepad", "Microsoft Word", "Microsoft Windows", "Paint"], "correct": 2, "slide": 27, "module": "Work with computers"}, {"q": "Which one is a function of an application?", "options": ["Managing computer hardware", "Managing computer software", "Allowing human control of the computer", "Doing quick calculations"], "correct": 3, "slide": 29, "module": "Work with computers"}, {"q": "You can use the portable storage devices to:", "options": ["Improve storage abilities of your computer.", "Transfer files from computer to another computer.", "Save a copy in a safe location.", "All of the above."], "correct": 3, "slide": 32, "module": "Work with computers"}, {"q": "These devices can be connected to a computer through Bluetooth technology except:", "options": ["Speakers", "Mouse", "Hard drive", "Headphones"], "correct": 2, "slide": 34, "module": "Work with computers"}, {"q": "What does it mean when a computer is \"online\"", "options": ["The computer is fully charged.", "The computer is waiting to connect to the internet.", "The computer is connected to the internet.", "The computer is powered on."], "correct": 2, "slide": 7, "module": "Access information online"}, {"q": "Which of the following terms does not apply to the internet?", "options": ["Massive", "An application", "A network", "Global"], "correct": 1, "slide": 9, "module": "Access information online"}, {"q": "Which of the following is a wireless option for connecting to the internet?", "options": ["Ethernet", "Wi-Fi", "Router", "Modem"], "correct": 1, "slide": 11, "module": "Access information online"}, {"q": "To access the World Wide Web, you need to use:", "options": ["Notepad", "Microsoft Edge", "Microsoft Word", "Microsoft Windows"], "correct": 1, "slide": 16, "module": "Access information online"}, {"q": "Which of the following features of the browser allows you to open multiple webpages in the same window?", "options": ["Tabs", "Favorites", "History", "Address bar"], "correct": 0, "slide": 18, "module": "Access information online"}, {"q": "Which of the following opens a new webpage when clicked?", "options": ["A hyperlink", "A webpage", "A URL", "A tooltip"], "correct": 0, "slide": 20, "module": "Access information online"}, {"q": "Which of the following can provide you with information about a product based on other customers' experiences?", "options": ["Return policy", "Search history", "Shipping policies", "Product ratings"], "correct": 3, "slide": 22, "module": "Access information online"}, {"q": "The search results that you receive from a search engine can include:", "options": ["Images", "Webpages", "Videos", "All of the above"], "correct": 3, "slide": 29, "module": "Access information online"}, {"q": "Which of the following considerations can help you effectively evaluate media messages?", "options": ["Who created the message?", "Who benefits from the message?", "Why the message is being sent?", "All of the above."], "correct": 3, "slide": 31, "module": "Access information online"}, {"q": "When you sign up for an email account, which of the following will you create?", "options": ["An email address", "An email number", "An account number", "A payment plan"], "correct": 0, "slide": 9, "module": "Communicate online"}, {"q": "Which of the following parts of the email interface do you use to view the contents of a message you have received in Outlook?", "options": ["Inbox", "Reading pane", "Drafts", "Compose pane"], "correct": 1, "slide": 11, "module": "Communicate online"}, {"q": "You can use email to send:", "options": ["Text", "Photos", "Videos", "All of the above"], "correct": 3, "slide": 13, "module": "Communicate online"}, {"q": "You receive a message from your manager about a project. A new person joins your team and you need to share the project details with them. Which of the following actions should you use to share the email with your new coworker without also sending the message to your manager?", "options": ["Reply to the email and add your new coworker as a recipient.", "Forward the email to your new coworker.", "Reply to the email and bcc your new coworker.", "Reply all to the email."], "correct": 1, "slide": 15, "module": "Communicate online"}, {"q": "You can use Skype to:", "options": ["Make a voice call to someone without knowing their phone number.", "Have a video call with someone in another location.", "Chat with someone using instant messaging.", "All of the above."], "correct": 3, "slide": 19, "module": "Communicate online"}, {"q": "Which of the following components should you look for in the URL of a webpage, to make sure you’re on a secure site?", "options": ["http", "secure", "https", "ssh"], "correct": 2, "slide": 9, "module": "Participate safely and responsibly online"}, {"q": "Which of these passwords is the strongest?", "options": ["John@453", "John500", "JoHn300", "125893"], "correct": 0, "slide": 11, "module": "Participate safely and responsibly online"}, {"q": "Your digital footprint is:", "options": ["The size of information in your online accounts.", "The number of people you’re connected to online.", "A record of everything you do and say online.", "Your online username."], "correct": 2, "slide": 13, "module": "Participate safely and responsibly online"}, {"q": "Which one of these actions is not violating copyrights?", "options": ["Using someone's images in a book you publish without their permission.", "Quoting a paragraph from someone's book and referencing them.", "Selling someone's video under your name.", "Selling someone's book without a license."], "correct": 1, "slide": 18, "module": "Participate safely and responsibly online"}, {"q": "Cyberbullying can take place:", "options": ["Only on social media platforms.", "Only through emails.", "Only on SMS.", "On social media platforms and SMS, and through emails."], "correct": 3, "slide": 20, "module": "Participate safely and responsibly online"}, {"q": "You want to access Microsoft Word and other Microsoft Office apps from your laptop without installing any software. You do not have an Office subscription. Which of the following Microsoft Office offerings is your best option?", "options": ["Office 365", "Office Online", "Office 2016", "None of the above"], "correct": 1, "slide": 5, "module": "Create digital content"}, {"q": "Which of the following types of content would Microsoft Word be most appropriate to use for?", "options": ["Numerical spreadsheets", "Letters", "Slide presentations", "Formulas and calculations"], "correct": 1, "slide": 10, "module": "Create digital content"}, {"q": "To create a Word document, you will go to the File menu and choose:", "options": ["Open", "New", "Print", "Save"], "correct": 1, "slide": 12, "module": "Create digital content"}, {"q": "Which of the following file extensions are Word documents typically saved with?", "options": [".xls", ".docx or .doc", ".ppt", ".word"], "correct": 1, "slide": 14, "module": "Create digital content"}, {"q": "To print a document in Word, you should go to the _______________menu.", "options": ["File", "Home", "Review", "Page Layout"], "correct": 0, "slide": 16, "module": "Create digital content"}, {"q": "To select a whole line of text in Word, you can:", "options": ["Click to the left of the text.", "Click to the right of the text.", "Select the first word in the text.", "Select the last word in text."], "correct": 0, "slide": 23, "module": "Create digital content"}, {"q": "When Word identifies a word that you have misspelled in your document, you will see:", "options": ["A squiggly line", "A double underline", "A dotted line", "None of the above"], "correct": 0, "slide": 25, "module": "Create digital content"}, {"q": "Which of the following commands opens the Replace feature?", "options": ["Ctrl+R", "Ctrl+S", "Ctrl+H", "Ctrl+N"], "correct": 2, "slide": 27, "module": "Create digital content"}, {"q": "Which of the following menus should you use to insert WordArt?", "options": ["Design", "Draw", "Insert", "View"], "correct": 2, "slide": 34, "module": "Create digital content"}, {"q": "From which menu can you apply a design to a table you’ve already created?", "options": ["Insert", "Design", "Layout", "View"], "correct": 1, "slide": 36, "module": "Create digital content"}, {"q": "When you add page numbers to a document, the page numbers will always be displayed in the:", "options": ["Left of the top of the page.", "Right of the bottom of the page.", "Center of the bottom of the page.", "You can choose where to add page numbers."], "correct": 3, "slide": 43, "module": "Create digital content"}, {"q": "From which of the following menus can you apply a theme?", "options": ["Design", "Draw", "Insert", "View"], "correct": 0, "slide": 45, "module": "Create digital content"}, {"q": "Which of the following commands opens the Tell Me feature?", "options": ["Alt+Q", "Alt+S", "Alt+R", "Alt+N"], "correct": 0, "slide": 47, "module": "Create digital content"}, {"q": "To convert a document to PDF file you should go to:", "options": ["File>Open", "File>Save As", "File>Share", "File>Options"], "correct": 1, "slide": 51, "module": "Create digital content"}, {"q": "You can access OneDrive by using only:", "options": ["A desktop", "A laptop", "iPad", "All of the above"], "correct": 3, "slide": 10, "module": "Collaborate and manage content digitally"}, {"q": "To check recent activity on your files, you should select:", "options": ["Sort", "View", "Information", "New"], "correct": 2, "slide": 12, "module": "Collaborate and manage content digitally"}, {"q": "Which one is not apart from OneDrive:", "options": ["Navigation pane", "The ribbon", "File list", "Tool bar"], "correct": 1, "slide": 14, "module": "Collaborate and manage content digitally"}, {"q": "For Microsoft accounts, items in OneDrive recycle bin are kept for _______________before being permanently deleted.", "options": ["15 days", "30 days", "60 days", "93 days"], "correct": 1, "slide": 16, "module": "Collaborate and manage content digitally"}, {"q": "When you share a file with others, you can share it only from:", "options": ["File explorer", "OneDrive", "Word Online app", "All of the above"], "correct": 3, "slide": 18, "module": "Collaborate and manage content digitally"}, {"q": "If you want to hide comments in a Word document, you should choose the _______________menu.", "options": ["File", "Insert", "Review", "View"], "correct": 2, "slide": 21, "module": "Collaborate and manage content digitally"}, {"q": "To add a comment to a Word document, find the New Comment option in which menu of the Word ribbon?", "options": ["Home", "Review", "View", "Insert"], "correct": 1, "slide": 23, "module": "Collaborate and manage content digitally"}, {"q": "For a preview of how the document will look if you make all the suggested changes permanent, which of the following options should you choose?", "options": ["Simple Markup", "All Markup", "No Markup", "Original"], "correct": 2, "slide": 25, "module": "Collaborate and manage content digitally"}, {"q": "To accept or reject tracked changes, which Word menu should you use?", "options": ["View", "Review", "Layout", "Home"], "correct": 1, "slide": 27, "module": "Collaborate and manage content digitally"}, {"q": "The view of the Outlook calendar can be set to show:", "options": ["Month only", "Week only", "Day only", "Any of the above"], "correct": 3, "slide": 31, "module": "Collaborate and manage content digitally"}, {"q": "When you search for a keyword, a result will be included if it contains the keyword in the:", "options": ["Attendees", "Subject", "Attachments", "All the above"], "correct": 3, "slide": 33, "module": "Collaborate and manage content digitally"}, {"q": "In the Outlook calendar, the longest reminder you can set for an appointment is:", "options": ["A day", "A week", "Two weeks", "A month"], "correct": 2, "slide": 35, "module": "Collaborate and manage content digitally"}, {"q": "When creating a new contact group in Outlook, you can add members from:", "options": ["Outlook contacts", "The address book", "A new email contact", "All the above"], "correct": 3, "slide": 39, "module": "Collaborate and manage content digitally"}];let questions=[],answers=[],pos=0,mode='';const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function home(){app.innerHTML=`<h1>Microsoft Digital Literacy</h1><p class="muted">Original source questions • One question per screen • No duplicate questions</p><p><b>${all.length} questions across 6 modules</b></p><label>Choose test</label><p><select id="scope"><option value="all">Full exam — ${all.length} questions</option>${[...new Set(all.map(x=>x.module))].map(m=>`<option value="${esc(m)}">${esc(m)} (${all.filter(x=>x.module===m).length})</option>`).join('')}</select></p><button class="btn" onclick="start()">Start test</button>`}function start(){let scope=document.getElementById('scope').value;questions=all.filter(x=>scope==='all'||x.module===scope);answers=Array(questions.length).fill(null);pos=0;show()}function show(){let q=questions[pos];app.innerHTML=`<div class="muted">Question ${pos+1} of ${questions.length} · ${esc(q.module)}</div><p class="bar"><div class="fill" style="width:${100*(pos+1)/questions.length}%"></div></p><h2>${esc(q.q)}</h2>${q.options.map((o,i)=>`<button class="option ${answers[pos]===i?'selected':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}<div class="nav"><button class="btn" onclick="prev()" ${pos===0?'disabled':''}>Previous</button><button class="btn" onclick="next()" ${answers[pos]===null?'disabled':''}>${pos===questions.length-1?'Finish test':'Next'}</button></div><p class="muted">Your answers are not revealed until the end.</p>`}function choose(i){answers[pos]=i;show()}function prev(){if(pos>0){pos--;show()}}function next(){if(answers[pos]===null)return;if(pos<questions.length-1){pos++;show()}else result()}function result(){let score=questions.filter((q,i)=>q.correct===answers[i]).length;app.innerHTML=`<h1>Test completed</h1><h2>${score} / ${questions.length} — ${Math.round(100*score/questions.length)}%</h2><p>Correct: ${score} · Incorrect: ${questions.length-score}</p><button class="btn" onclick="home()">New test</button><h2>Answer review</h2>${questions.map((q,i)=>`<div class="review"><b>${i+1}. ${esc(q.q)}</b><p class="${q.correct===answers[i]?'right':'wrong'}">Your answer: ${esc(q.options[answers[i]])} ${q.correct===answers[i]?'✓':'✗'}</p><p>Correct answer: <b>${esc(q.options[q.correct])}</b></p></div>`).join('')}`};try{home()}catch(e){document.getElementById("app").innerHTML="<h1>Microsoft Digital Literacy Quiz</h1><p>Please open this file in Safari to take the test.</p>"}</script></body></html>
