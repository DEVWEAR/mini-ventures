<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#241d35"><title>Mini Ventures | Pizza Studio</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#19162a;color:#fff;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;border:0}#app{max-width:540px;margin:auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#251d35}header{padding:calc(env(safe-area-inset-top) + 7px) 15px 10px;display:flex;justify-content:space-between;align-items:center;background:#211a31}.brand{font-size:19px;font-weight:1000;letter-spacing:-.8px}.brand span{color:#ffc26b}.small{font-size:10px;color:#baaac8;font-weight:750;letter-spacing:1.1px}.cash{padding:8px 12px;background:#41334b;border:1px solid #70556a;border-radius:15px;font-weight:900;color:#ffdb8e}.room{flex:1;min-height:155px;position:relative;overflow:hidden;background:linear-gradient(155deg,#60466e,#c66d69 55%,#edb779)}.room svg{height:100%;width:100%;display:block}.room:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 65%,#211a3125)}.customer{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);width:116px;height:142px;filter:drop-shadow(0 7px 4px #2e203a55)}.customer svg{width:100%;height:100%}.order{position:absolute;top:9px;left:50%;transform:translateX(-50%);padding:9px 14px;background:#fff7e8;color:#49364a;border-radius:18px;font-size:13px;font-weight:950;white-space:nowrap;box-shadow:0 5px #694a5940}.panel{padding:10px 13px calc(env(safe-area-inset-bottom) + 10px);background:#251d35}.headline{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:850;color:#eacdb5;margin-bottom:7px}.pizza-zone{display:flex;align-items:center;justify-content:center;gap:10px;background:#3c2c41;border:1px solid #745263;border-radius:20px;padding:9px;min-height:145px}.pizza{width:min(34vw,152px);height:min(34vw,152px);min-width:112px;min-height:112px;border-radius:50%;position:relative;background:radial-gradient(circle,#e9bb6d 0 62%,#bc733d 65%,#edb46e 7 .customer{transition:transform .7s ease,opacity .5s ease;animation:idleBounce 1.5s ease-in-out infinite}.customer.arriving{animation:enter .8s cubic-bezier(.2,.8,.2,1) both}.customer.leaving{animation:exit .8s ease-in both}.customer svg{overflow:visible}.customer svg .eyes{transform-origin:60px 63px;animation:blink 4.5s infinite}.customer svg .arms{transform-origin:60px 110px;animation:wave 2s ease-in-out infinite alternate}.chef-sprite{position:absolute;bottom:6%;left:8%;width:90px;height:130px;filter:drop-shadow(0 5px 5px #35243b55);animation:chefSway 2.2s ease-in-out infinite alternate}.chef-sprite svg{width:100%;height:100%}.chef-sprite.cooking{animation:chefCook .35s ease-in-out infinite alternate}.chef-sprite.celebrate{animation:chefCelebrate .38s ease-in-out 3 alternate}@keyframes idleBounce{0%,100%{margin-bottom:0}50%{margin-bottom:5px}}@keyframes enter{from{opacity:0;translate:130px 0}to{opacity:1;translate:0 0}}@keyframes exit{from{opacity:1;translate:0 0}to{opacity:0;translate:-140px 0}}@keyframes blink{0%,42%,45%,100%{transform:scaleY(1)}43.5%{transform:scaleY(.1)}}@keyframes wave{from{transform:rotate(-4deg)}to{transform:rotate(6deg)}}@keyframes chefSway{to{transform:rotate(3deg) translateY(-3px)}}@keyframes chefCook{to{transform:rotate(-8deg) translateY(-6px)}}@keyframes chefCelebrate{to{transform:translateY(-17px) rotate(7deg)}}@media(prefers-reduced-motion:reduce){.customer,.customer svg .eyes,.customer svg .arms,.chef-sprite{animation:none!important}}.order-queue{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 9px}.order-card{flex:1;min-width:0;padding:8px 5px;border:1px solid #805d76;background:#48344d;color:#fce7d1;border-radius:12px;text-align:center;font-size:11px;font-weight:850}.order-card.active{background:#805069;border-color:#ffd18c;box-shadow:inset 0 0 0 1px #ffd18c}.order-card .timer{height:4px;background:#241b32;border-radius:6px;overflow:hidden;margin-top:6px}.order-card .timer i{display:block;height:100%;background:#ffb964}.order-card .timer i.low{background:#ff6e70}.customer.impatient{filter:drop-shadow(0 5px 4px #ee5050);animation:impatient .18s ease-in-out infinite alternate}@keyframes impatient{to{transform:translateX(calc(-50% + 3px)) rotate(2deg)}}.service-banner{font-size:11px;color:#f5cb98;text-align:center;margin:4px 0 7px}.reputation{display:flex;align-items:center;justify-content:space-between;background:#34263d;border:1px solid #6f536c;border-radius:12px;padding:8px 11px;margin-bottom:8px;font-weight:850;font-size:12px}.reputation b{color:#ffcd7b}.customer.angry svg .eyes{animation:none}.customer.angry{filter:drop-shadow(0 0 9px #ff5656)!important}.customer.angry:after{content:'😡';position:absolute;top:-14px;right:-18px;font-size:27px;animation:shake .22s infinite alternate}@keyframes shake{to{transform:rotate(12deg) translateX(4px)}}.reputation .trend{font-size:11px;color:#e8b5ad}</style></head><body><main id="app"><header><div><div class="brand">MINI <span>VENTURES</span> 🍕</div><div class="small">PIZZA STUDIO · REPUTATION • ALPHA 0.8</div></div><div class="cash">🪙 <span id="coins">0</span></div></header><section class="room"><svg viewBox="0 0 390 340" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="wall" x2="0" y2="1"><stop stop-color="#8b5977"/><stop offset="1" stop-color="#df8e75"/></linearGradient></defs><rect width="390" height="340" fill="url(#wall)"/><rect x="23" y="38" width="96" height="132" rx="10" fill="#473752" stroke="#edc4a3" stroke-width="9"/><rect x="34" y="49" width="74" height="109" fill="#d8ab8d"/><path d="M70 49V158M34 106H108" stroke="#fff0d3" stroke-width="6"/><rect x="270" y="35" width="97" height="132" rx="10" fill="#473752" stroke="#edc4a3" stroke-width="9"/><rect x="281" y="46" width="75" height="110" fill="#d8ab8d"/><path d="M318 46V156M281 102H356" stroke="#fff0d3" stroke-width="6"/><rect x="123" y="21" width="144" height="60" rx="16" fill="#493349" stroke="#ffe1a1" stroke-width="5"/><text x="195" y="46" font-family="sy -width="11" stroke-linecap="round"/></svg></div><div class="customer arriving" id="customer"></div><div class="toast" id="toast"></div></section><section class="panel"><div class="headline"><span id="label">MAKE THE ORDER</span><span id="served">Served 0 ⭐</span></div><div class="reputation"><span id="reputation">⭐ 4.5 / 5</span><b id="reputationCount">😊 0 · 😡 0</b></div><div class="order-queue" id="queue"></div><div class="service-banner" id="serviceBanner"></div><div class="pizza-zone"><div class="pizza" id="pizza"><div class="toppings" id="toppings"></div></div><div class="side"><strong id="recipe">Cheese Pizza</strong><span id="instructions">Add sauce, cheese and toppings, then bake.</span><div id="picked" style="margin-top:6px;color:#ffd89c;font-weight:900"></div></div></div><div class="ingredients"><button class="ingredient" data-add="sauce">🍅 Sauce</button><button class="ingredient" data-add="cheese">🧀 Cheese</button><button class="ingredient" data-add="pepperoni">🔴 Pepperoni</button><button class="ingredient" data-add="sausage">🌭 Sausage</button><button class="ingredient" data-add="mushroom">🍄 Mushroom</button><button class="ingredient" data-add="pepper">🫑 Peppers</button></div><div class="oven"><button class="mainbtn" id="bake">🔥 BAKE PIZZA</button><button class="reset" id="reset">↺ Reset</button></div><div class="meter"><div id="bar"></div></div><div class="foot"><span id="feedback">Complete the customer's recipe</span><button id="lang">العربية</button></div></section></main><script>
(()=>{'use strict';const $=x=>document.getElementById(x),key='mv-pizza-studio-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key))||{}}catch(e){}let s=Object.assign({coins:0,served:0,ar:false,reputation:75,happy:0,angry:0,regulars:0},saved),order=0,added=[],phase='prep',heat=0,last=performance.now(),busy=false,queueClock=0;let waiting=[{recipe:0,patience:100},{recipe:1,patience:100}];let angerTimer=0;const menu=[{name:['Cheese Pizza','بيتزا جبن'],items:['sauce','cheese']},{name:['Pepperoni Pizza','بيتزا ببروني'],items:['sauce','cheese','pepperoni']},{name:['Sausage Pizza','بيتزا نقانق'],items:['sauce','cheese','sausage']},{name:['Garden Pizza','بيتزا خضار'],items:['sauce','cheese','mushroom','pepper']},{name:['Supreme Pizza','بيتزا مشكلة'],items:['sauce','cheese','pepperoni','sausage','pepper']}],icons={pepperoni:'🔴',sausage:'🌭',mushroom:'🍄',pepper:'🫑'};const T=(a,b)=>s.ar?b:a;const newOrder=()=>({recipe:Math.floor(Math.random()*menu.length),patience:100});function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}function person(){const tones=['#dca079','#9c6655','#f0c092','#c48660'],shirts=['#6b79b8','#5d998e','#b25f83','#e0a455'],hair=['#4c3245','#292b42','#805037','#322b3d'],n=s.served%4;return '<svg viewBox="0 0 120 145"><ellipse cx="60" cy="139" rx="50" ry="6" fill="#33243a" opacity=".2"/><path class="arms" d="M17 145Q16 92 60 92Q104 92 103 145" fill="'+shirts[n]+'"/><path d="M42 98L60 121L78 98" fill="#f8ddc4"/><rect x="49" y="82" width="22" height="23" rx="9" fill="'+tones[n]+'"/><ellipse cx="60" cy="57" rx="40" ry="44" fill="'+tones[n]+'"/><path d="M19 56Q12 4 60 10Q109 7 101 61Q90 30 65 32Q37 38 19 56Z" fill="'+hair[n]+'"/><g class="eyes"><ellipse cx="44" cy="62" rx="5" ry="7" fill="#fff"/><ellipse cx="77" cy="62" rx="5" ry="7" fill="#fff"/><circle cx="45" cy="63" r="3" fill="#354157"/><circle cx="76" cy="63" r="3" fill="#354157"/></g><path d="M47 81Q60 91 73 81" fill="none" stroke="#914f52" stroke-width="3" stroke-linecap="round"/><circle cx="27" cy="77" r="5" fill="#e5a28d" opacity=".5"/><circle cx="93" cy="77" r="5" fill="#e5a28d" opacity=".5"/></svg>'}function toast(v){$('toast').textContent=v;$('toast').style.opacity=1;setTimeout(()=>$('toast').style.opacity=0,1400)}function drawPizza(){const p=$('pizza');p.className='pizza'+(added.includes('sauce')?' sauce':'')+(added.includes('cheese')?' cheese':'');const locations=[[34,32],[67,29],[47,53],[73,61],[25,66],[53,78],[51,19],[18,48]];let str='';added.filter(x=>icons[x]).forEach((x,j)=>{for(let i=0;i<6;i++){const pos=locations[(i+j*2)%locations.length];str+='<span class="top" style="left:'+(pos[0]+(j%2)*3)+'%;top:'+(pos[1]+(j%3)*2)+'%">'+icons[x]+'</span>'}});$('toppings').innerHTML=str}function render(){$('reputation').textContent='⭐ '+(1+4*Math.max(0,Math.min(100,s.reputation))/100).toFixed(1)+'/5 · '+T('Reputation','السمعة');$('reputationCount').textContent='😍 '+s.happy+' · 😡 '+s.angry+' · 🔁 '+s.regulars;order=waiting.length?waiting[0].recipe:0;const m=menu[order];$('queue').innerHTML=waiting.map((o,i)=>'<div class="order-card '+(i===0?'active':'')+'"><div>🍕 '+menu[o.recipe].name[s.ar?1:0]+'</div><div class="timer"><i class="'+(o.patience<30?'low':'')+'" style="width:'+Math.max(0,o.patience)+'%"></i></div></div>').join('');$('serviceBanner').textContent=T('Orders waiting: ','طلبات بانتظارك: ')+waiting.length+' · '+T('Serve before patience runs out','جهز الطلب قبل نفاد الصبر');$('customer').classList.toggle('impatient',!!waiting.length&&waiting[0].patience<25);$('coins').textContent=s.coins;$('served').textContent=T('Served ','تم تقديم ')+s.served+' ⭐';$('order').textContent='🍕 '+m.name[s.ar?1:0];$('recipe').textContent=m.name[s.ar?1:0];$('label').textContent=T('MAKE THE ORDER','جهّز الطلب');$('instructions').textContent=T('Add sauce, cheese and requested toppings.','أضف الصلصة والجبن والإضافات المطلوبة.');$('picked').textContent=T('Added: ','المكونات: ')+(added.length?added.join(', '):'—');$('feedback').textContent=phase==='prep'?T('Follow the order, then bake','جهّز المكونات ثم اخبز البيتزا'):phase==='baking'?T('Baking... watch the oven!','البيتزا في الفرن... انتبه!'):T('Ready to serve!','جاهزة للتقديم!');$('bake').textContent=phase==='ready'?T('🍕 SERVE PIZZA','🍕 قدّم البيتزا'):phase==='baking'?T('🔥 BAKING...','🔥 جاري الخبز...'):T('🔥 BAKE PIZZA','🔥 اخبز البيتزا');$('bake').disabled=phase==='baking';$('reset').textContent=T('↺ Reset','↺ إعادة');$('lang').textContent=s.ar?'English':'العربية';const names={sauce:['🍅 Sauce','🍅 صلصة'],cheese:['🧀 Cheese','🧀 جبن'],pepperoni:['🔴 Pepperoni','🔴 ببروني'],sausage:['🌭 Sausage','🌭 نقانق'],mushroom:['🍄 Mushroom','🍄 فطر'],pepper:['🫑 Peppers','🫑 فلفل']};document.querySelectorAll('[data-add]').forEach(b=>{const id=b.dataset.add;b.textContent=names[id][s.ar?1:0];b.disabled=phase!=='prep';b.classList.toggle('selected',added.includes(id))});$('bar').style.width=(heat*100)+'%';$('customer').innerHTML=person();drawPizza()}function reset(){added=[];phase='prep';heat=0;$('chefSprite').classList.remove('cooking');render()}document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(phase!=='prep')return;const id=b.dataset.add;if(added.includes(id)){added=added.filter(x=>x!==id)}else{if(id==='cheese'&&!added.includes('sauce')){toast(T('Add sauce first!','أضف الصلصة أولاً!'));return}added.push(id)}render()});$('reset').onclick=reset;$('lang').onclick=()=>{s.ar=!s.ar;save();render()};$('bake').onclick=()=>{if(phase==='ready'){if(busy)return;busy=true;const correct=added.length===menu[order].items.length&&added.every(x=>menu[order].items.includes(x));if(correct){const delighted=waiting.length&&waiting[0].patience>55;s.coins+=25+(delighted?5:0);s.reputation=Math.min(100,s.reputation+(delighted?5:2));s.happy++;if(s.happy%5===0){s.regulars++;s.coins+=15}toast(delighted?T('Delighted! +5 reputation & tip','زبون سعيد! +5 سمعة وبقشيش'):T('Good service! +2 reputation','خدمة جيدة! +2 سمعة'))}else{s.coins+=8;s.reputation=Math.max(0,s.reputation-2);toast(T('Wrong recipe! -2 reputation','طلب خاطئ! -2 سمعة'))}s.served++;if(waiting.length)waiting.shift();save();$('chefSprite').classList.add('celebrate');$('customer').classList.remove('arriving');$('customer').classList.add('leaving');setTimeout(()=>{$('chefSprite').classList.remove('celebrate');$('customer').classList.remove('leaving');$('customer').classList.add('arriving');if(!waiting.length)waiting.push(newOrder());busy=false;reset()},800);return}if(phase!=='prep')return;if(!added.includes('sauce')||!added.includes('cheese')){toast(T('Sauce and cheese required!','لازم الصلصة والجبن!'));return}phase='baking';heat=0;$('chefSprite').classList.add('cooking');render()};function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;queueClock+=dt;if(queueClock>.3){queueClock=0;for(const o of waiting)o.patience=Math.max(0,o.patience-.55);if(waiting.length&&waiting[0].patience<=0&&!busy){waiting.shift();s.angry++;s.reputation=Math.max(0,s.reputation-5);save();reset();$('customer').classList.add('angry');clearTimeout(angerTimer);angerTimer=setTimeout(()=>$('customer').classList.remove('angry'),1700);toast(T('Angry customer! -5 reputation 😡','زبون زعلان! -5 سمعة 😡'));if(!waiting.length)waiting.push(newOrder())}else if(waiting.length)render()}if(phase==='baking'){heat=Math.min(1,heat+dt/2.5);$('bar').style.width=(heat*100)+'%';if(heat>=1){phase='ready';$('chefSprite').classList.remove('cooking');render();toast(T('Pizza is baked!','استوت البيتزا!'))}}requestAnimationFrame(tick)}setInterval(()=>{if(waiting.length<3){waiting.push(newOrder());render()}},12000);render();requestAnimationFrame(tick)})();
</script></body></html>
