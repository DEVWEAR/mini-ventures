function destroyEnemy(o,index){objects.splice(index,1);score+=o.type==='boss'?800:65;runCoins+=o.type==='boss'?35:3;kills++;if(o.type==='enemy'&&Math.random()<.23)objects.push({x:o.x,y:o.y,type:'weapon',r:14,speed:75,spin:0});if(o.type==='boss'){runBosses++;banner(tr('FLAGSHIP DESTROYED! +35','دمرت سفينة الزعيم! +35'))}burst(o.x,o.y,'#ff9b72',o.type==='boss'?36:15);beep(360,.11,'triangle')}
function step(dt){elapsed+=dt;invuln=Math.max(0,invuln-dt);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt);comboTimer=Math.max(0,comboTimer-dt);warp=Math.max(0,warp-dt);if(comboTimer<=0&&combo>0){combo=0;$('comboHud').classList.add('hidden')}if(warp<=0)$('powerHud').classList.add('hidden');else $('powerHud').textContent='❄️ '+tr('TIME WARP','تباطؤ الزمن')+' '+Math.ceil(warp)+'s';
const nextSector=Math.min(9,1+Math.floor(elapsed/27));if(nextSector!==sector){sector=nextSector;banner(tr('SECTOR ','المرحلة ')+sector+' ⚡');beep(820,.2)}
if(sector>=3&&sector%3===0&&bossSpawnedFor!==sector){bossSpawnedFor=sector;objects.push({x:W/2,y:-75,type:'boss',r:42,hp:16+sector*3,maxHp:16+sector*3,speed:-145,spin:0,phase:rand(0,6),shoot:1.3});banner(tr('⚠ ENEMY FLAGSHIP','⚠ سفينة زعيم العدو'));beep(180,.3,'sawtooth')}
spawn-=dt;if(spawn<=0){spawnObject();spawn=Math.max(.65,1.15-sector*.045)*rand(.85,1.12)}
const slow=warp>0?.55:1;fireClock-=dt;missileClock-=dt;
if(fireClock<=0){fireClock=Math.max(.075,.25-(data.gun||0)*.045-(weaponPower-1)*.025);shots.push({x:player.x-9,y:player.y-23,vy:-720,damage:weaponPower,kind:'gun'},{x:player.x+9,y:player.y-23,vy:-720,damage:weaponPower,kind:'gun'});if(weaponPower>=3)shots.push({x:player.x,y:player.y-26,vy:-760,damage:weaponPower-1,kind:'laser'})}
if((data.laser||0)>0&&Math.floor((elapsed-dt)/3.4)!==Math.floor(elapsed/3.4)){shots.push({x:player.x,y:player.y-29,vy:-950,damage:2+(data.laser||0),kind:'laser'})}
if((data.missile||0)>0&&missileClock<=0){missileClock=2.7-(data.missile||0)*.5;shots.push({x:player.x,y:player.y-24,vy:-350,damage:3+(data.missile||0)*2,kind:'missile'})}
for(let i=objects.length-1;i>=0;i--){const o=objects[i];if(o.type==='enemy'){if(o.state==='enter'){o.y+=(o.homeY-o.y)*Math.min(1,dt*5.5);if(Math.abs(o.y-o.homeY)<3)o.state='hold'}else if(o.state==='hold'){o.x+=(o.homeX+Math.sin(elapsed*1.35+(o.group||0)*Math.PI)*19-o.x)*Math.min(1,dt*4);o.y+=(o.homeY-o.y)*Math.min(1,dt*4);if(Math.random()<dt*.006&&objects.filter(e=>e.type==='enemy'&&e.state==='dive').length===0){o.state='dive';o.diveX=player.x}}else if(o.state==='dive'){o.y+=(170+sector*19)*dt*slow;o.x+=(o.diveX-o.x)*Math.min(1,dt*1.8);if(o.y>H*.48)o.state='return'}else if(o.state==='return'){o.y+=(o.homeY-o.y)*Math.min(1,dt*2.8);o.x+=(o.homeX-o.x)*Math.min(1,dt*2.8);if(Math.abs(o.y-o.homeY)<5)o.state='hold'}}else o.y+=(o.type==='boss'?70:105+sector*12+o.speed)*dt*slow;if(o.type==='boss')o.x=clamp(W/2+Math.sin(elapsed*1.7+o.phase)*W*.31,46,W-46);if(o.type==='enemy')o.x=clamp(o.x,23,W-23);
if((o.type==='enemy'||o.type==='boss')&&o.y>30&&o.y<H*.68){o.shoot-=dt;if(o.shoot<=0){o.shoot=o.type==='boss'?.95:rand(Math.max(.8,1.4-sector*.045),Math.max(1.25,2.2-sector*.05));const a=Math.atan2(player.y-o.y,player.x-o.x);enemyShots.push({x:o.x,y:o.y+12,vx:Math.cos(a)*125,vy:Math.max(120,Math.sin(a)*125),kind:'bomb'});if(o.type==='boss'){enemyShots.push({x:o.x-23,y:o.y,vx:-85,vy:170},{x:o.x+23,y:o.y,vx:85,vy:170})}}}
if(o.y>H+55){if(o.type==='enemy'){o.state='return';o.y=H*.52}else{objects.splice(i,1);continue}}
const distance=Math.hypot(o.x-player.x,o.y-player.y);if(o.type==='star'&&data.magnet&&distance<55+data.magnet*22){o.x+=(player.x-o.x)*Math.min(1,dt*6);o.y+=(player.y-o.y)*Math.min(1,dt*6)}
if(distance<o.r+player.r-5){objects.splice(i,1);if(o.type==='enemy'||o.type==='boss'){hitPlayer(o.x,o.y);if(mode!=='play')return}else if(o.type==='weapon'){weaponPower=Math.min(4,weaponPower+1);banner(tr('WEAPON POWER +1','قوة السلاح +1'));burst(o.x,o.y,'#8cffa6',18);beep(930,.2)}else if(o.type==='heart'){lives=Math.min(5,lives+1);burst(o.x,o.y,'#ff9db8',10)}else if(o.type==='warp'){warp=6;$('powerHud').classList.remove('hidden');banner(tr('TIME WARP','تباطؤ الزمن'))}else{runPickups++;combo++;comboTimer=3.5;const mul=Math.min(5,1+Math.floor(combo/5));runCoins+=(1+data.bonus)*mul;score+=10*mul+sector;if(combo>=3){$('comboHud').classList.remove('hidden');$('comboHud').textContent='⚡ COMBO '+combo+' · x'+mul}burst(o.x,o.y,'#ffe4a0',9);beep(600,.05);if(runCoins>=missionTarget){runCoins+=10;missionTarget+=30;banner(tr('BONUS +10','مكافأة +10'))}}}}
for(let i=shots.length-1;i>=0;i--){const b=shots[i];if(b.kind==='missile'){let target=null,dist=Infinity;for(const o of objects){if(o.type==='enemy'||o.type==='boss'){const d=Math.hypot(o.x-b.x,o.y-b.y);if(d<dist){dist=d;target=o}}}if(target){b.x+=(target.x-b.x)*Math.min(1,dt*3);b.y+=(target.y-b.y)*Math.min(1,dt*3)}else b.y+=b.vy*dt}else b.y+=b.vy*dt;if(b.y< -35){shots.splice(i,1);continue}for(let j=objects.length-1;j>=0;j--){const o=objects[j];if((o.type==='enemy'||o.type==='boss')&&Math.hypot(o.x-b.x,o.y-b.y)<o.r+7){shots.splice(i,1);o.hp-=b.damage;burst(b.x,b.y,'#84eeff',3);if(o.hp<=0)destroyEnemy(o,j);break}}}
for(let i=enemyShots.length-1;i>=0;i--){const b=enemyShots[i];b.x+=b.vx*dt*slow;b.y+=b.vy*dt*slow;if(b.y>H+15||b.x< -15||b.x>W+15){enemyShots.splice(i,1);continue}if(Math.hypot(b.x-player.x,b.y-player.y)<player.r+5){enemyShots.splice(i,1);hitPlayer(player.x,player.y);if(mode!=='play')return}}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.98;p.vy*=.98;if(p.life<=0)particles.splice(i,1)}
scoreRemainder+=dt*15;const inc=Math.floor(scoreRemainder);if(inc){score+=inc;scoreRemainder-=inc}updateHud()}
function drawShip(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);if(invuln>0&&mode==='play'&&Math.floor(elapsed*13)%2===0)ctx.globalAlpha=.48;ctx.shadowBlur=24;const colors={nova:['#60f3ef','#65d9f0'],ember:['#ff9d66','#ff725c'],royal:['#bf8cff','#9e80f9'],gold:['#ffdf72','#ffd073']};const palette=colors[data.skin]||colors.nova;ctx.shadowColor=palette[0];ctx.fillStyle=palette[1];ctx.beginPath();ctx.moveTo(0,-27);ctx.lineTo(19,18);ctx.lineTo(6,11);ctx.lineTo(0,17);ctx.lineTo(-6,11);ctx.lineTo(-19,18);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#142f58';ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(8,7);ctx.lineTo(-8,7);ctx.closePath();ctx.fill();ctx.fillStyle='#fff2c1';ctx.beginPath();ctx.ellipse(0,-5,4,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff9d77';ctx.beginPath();ctx.moveTo(-8,16);ctx.lineTo(-4,16+rand(9,20));ctx.lineTo(0,16);ctx.lineTo(4,16+rand(9,20));ctx.lineTo(8,16);ctx.fill();if(shieldCharges>0){ctx.strokeStyle='#a2fff4';ctx.lineWidth=2;ctx.globalAlpha=.65;ctx.beginPath();ctx.arc(0,0,33,0,Math.PI*2);ctx.stroke()}ctx.restore()}function draw(t){ctx.clearRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate(rand(-5,5),rand(-5,5));const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#010208');bg.addColorStop(.5,'#080913');bg.addColorStop(1,'#130a20');ctx.fillStyle=bg;ctx.fillRect(-10,-10,W+20,H+20);ctx.globalAlpha=.09;ctx.fillStyle='#65296c';ctx.beginPath();ctx.ellipse(W*.8,H*.3,125,260,-.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#214a64';ctx.beginPath();ctx.ellipse(W*.13,H*.73,90,240,.3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;for(const s of stars){const yy=(s.y+t*s.speed*.024)%H;ctx.fillStyle='rgba(209,240,255,'+(.35+.5*Math.sin(t*.001+s.x))+')';ctx.beginPath();ctx.arc(s.x,yy,s.r,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='#44567812';ctx.lineWidth=1;const shift=t*.018%68;for(let x=W*.15;x<W;x+=W*.35){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=-68+shift;y<H;y+=68){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}if(mode==='play'||mode==='paused'){for(const o of objects){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.spin);if(o.type==='star'){ctx.shadowColor='#ffdf85';ctx.shadowBlur=20;ctx.fillStyle='#ffe7a4';ctx.beginPath();for(let j=0;j<10;j++){const a=j*Math.PI/5-Math.PI/2,r=j%2?7:17;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill()}else if(o.type==='heart'||o.type==='warp'||o.type==='weapon'){ctx.font='30px system-ui';ctx.textAlign='center';ctx.fillText(o.type==='warp'?'❄':o.type==='weapon'?'⚡':'❤',0,10)}else{ctx.shadowColor=o.type==='boss'?'#ffb36a':'#ff6499';ctx.shadowBlur=o.type==='boss'?28:17;ctx.fillStyle=o.type==='boss'?'#a35379':'#ed588c';ctx.strokeStyle=o.type==='boss'?'#ffdd9c':'#ffb6d2';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,o.r);ctx.lineTo(-o.r*.4,0);ctx.lineTo(-o.r,-o.r*.45);ctx.lineTo(-o.r*.42,-o.r*.3);ctx.lineTo(0,-o.r);ctx.lineTo(o.r*.42,-o.r*.3);ctx.lineTo(o.r,-o.r*.45);ctx.lineTo(o.r*.4,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#302047';ctx.fillRect(-o.r*.28,-o.r*.22,o.r*.56,o.r*.32);ctx.fillStyle='#fff0bc';ctx.fillRect(-o.r*.12,-o.r*.19,o.r*.24,o.r*.25);if(o.type==='boss'){ctx.fillStyle='#3c2747';ctx.fillRect(-o.r,-o.r-15,o.r*2,5);ctx.fillStyle='#ffca77';ctx.fillRect(-o.r,-o.r-15,o.r*2*Math.max(0,o.hp/o.maxHp),5)}}ctx.restore()}for(const b of shots){ctx.shadowColor=b.kind==='missile'?'#ffb36d':'#7fffea';ctx.shadowBlur=12;ctx.fillStyle=b.kind==='missile'?'#ffc07c':b.kind==='laser'?'#7fb4ff':'#9cfff6';ctx.fillRect(b.x-(b.kind==='laser'?4:2),b.y-16,b.kind==='laser'?8:4,21)}for(const b of enemyShots){ctx.shadowColor='#ff527a';ctx.shadowBlur=15;ctx.fillStyle='#ff648f';ctx.beginPath();ctx.arc(b.x,b.y,b.kind==='bomb'?7:5,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;drawShip(player.x,player.y);for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.r,p.r)}ctx.globalAlpha=1;if(flash>0){ctx.fillStyle='#ff597a55';ctx.fillRect(0,0,W,H)}}else{drawShip(W/2,H*.59,1.8)}ctx.restore()}function frame(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;if(mode==='play')step(dt);draw(t);if(noticeTime>0){if(mode==='play')noticeTime-=dt;if(noticeTime<=0)$('banner').classList.remove('show')}requestAnimationFrame(frame)}menu();requestAnimationFrame(frame)})();
</script></body></html>
