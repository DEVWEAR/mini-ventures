<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f7eddc"><title>Mini Ventures — Playable Prototype</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#f7eddc;font-family:system-ui,-apple-system,sans-serif;color:#253c3a;overflow:hidden}#app{max-width:520px;margin:auto;height:100dvh;display:flex;flex-direction:column;background:#f9f2e6}header{padding:calc(env(safe-area-inset-top) + 12px) 16px 9px;display:flex;align-items:center;justify-content:space-between;background:#fff9ee;gap:8px}.brand{font-size:20px;font-weight:1000;letter-spacing:-.9px}.brand span{color:#ef854f}.coins{background:#ffe7a7;border-radius:24px;padding:8px 13px;font-weight:900;white-space:nowrap}.sub{font-size:11px;font-weight:700;opacity:.6}#scene{flex:1;min-height:0;position:relative;background:linear-gradient(#b7e8e4 0 38%,#d1e9c5 38% 100%)}canvas{display:block;width:100%;height:100%;touch-action:none}#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#253c3a;color:white;border-radius:18px;padding:10px 14px;font-weight:800;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}.bottom{background:#fff9ee;padding:10px 14px calc(env(safe-area-inset-bottom) + 13px);box-shadow:0 -6px 30px #526c5820}.stats{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;font-weight:800}.progress{height:9px;border-radius:9px;background:#e5dfcf;overflow:hidden;margin:0 0 11px}.bar{height:100%;width:0%;background:#55b9a0;transition:width .3s}.actions{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}button{border:0;border-radius:15px;padding:12px 5px;font-weight:900;font-size:12px;cursor:pointer;min-height:58px;color:#263d39;background:#e9e4d9}button.primary{background:#fa9b58;color:#332e26;box-shadow:0 4px 0 #d77a39}button:disabled{opacity:.46;box-shadow:none}button small{display:block;font-size:10px;margin-top:3px;opacity:.75}#lang{font-size:12px;background:#e8efe8;border-radius:12px;padding:8px;min-height:0}.hint{text-align:center;font-size:11px;color:#78908a;margin-top:10px}@media(max-width:370px){.brand{font-size:17px}button{font-size:11px;padding:9px 3px}} </style></head><body><div id="app"><header><div><div class="brand">MINI <span>VENTURES</span></div><div class="sub" id="subtitle">START SMALL. DREAM BIG.</div></div><div style="display:flex;align-items:center;gap:6px"><button id="lang" aria-label="Change language">العربية</button><div class="coins">🪙 <span id="money">0</span></div></div></header><div id="scene"><canvas id="game"></canvas><div id="toast"></div></div><div class="bottom"><div class="stats"><span id="level">⭐ Reputation 0 / 10</span><span id="served">0 orders served</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="actions"><button class="primary" id="serve">🍔 Serve order<small>+10 coins</small></button><button id="upgrade">⚡ Upgrade<small>30 coins</small></button><button id="hire">👩‍🍳 Hire helper<small>100 coins</small></button></div><div class="hint" id="hint">Tap Serve to delight customers • Progress saves automatically</div></div></div><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');const $=s=>document.querySelector(s);const safe=()=>{try{return JSON.parse(localStorage.getItem('mv_save_v1'))||{}}catch{return {}}};const initial=safe();let money=Math.max(0,Number(initial.money)||0),served=Math.max(0,Number(initial.served)||0),upgrades=Math.max(0,Number(initial.upgrades)||0),helpers=Math.max(0,Number(initial.helpers)||0),ar=initial.ar===true;let customers=[],particles=[],clock=0,last=0,autoClock=0,toastTimer=0,W=400,H=600;const words={en:{sub:'START SMALL. DREAM BIG.',reputation:'⭐ Reputation',orders:'orders served',serve:'🍔 Serve order',upgrade:'⚡ Upgrade',hire:'👩‍🍳 Hire helper',hint:'Tap Serve to delight customers • Progress saves automatically',need:'Not enough coins!',empty:'Wait for the next customer!',great:'Order served! +',helper:'Helper hired!',improved:'Kitchen upgraded!',full:'Max 3 helpers',customer:'ORDER',ready:'YOUR FIRST VENTURE',price:'coins'},ar:{sub:'ابدأ صغير، واحلم كبير',reputation:'⭐ السمعة',orders:'طلب مكتمل',serve:'🍔 قدّم الطلب',upgrade:'⚡ تطوير',hire:'👩‍🍳 وظّف مساعد',hint:'اضغط تقديم الطلب • تقدمك ينحفظ تلقائياً',need:'عملاتك ما تكفي!',empty:'انتظر الزبون القادم!',great:'تم تقديم الطلب! +',helper:'تم توظيف مساعد!',improved:'تم تطوير المطبخ!',full:'الحد الأقصى 3 مساعدين',customer:'طلب',ready:'مشروعك الأول',price:'عملة'}};function save(){try{localStorage.setItem('mv_save_v1',JSON.stringify({money,served,upgrades,helpers,ar}))}catch{}}function txt(k){return words[ar?'ar':'en'][k]}function costUpgrade(){return 30+upgrades*35}function costHire(){return 100+helpers*125}function reward(){return 10+upgrades*5}function update(){const rep=served%10;$('#money').textContent=money;$('#subtitle').textContent=txt('sub');$('#level').textContent=txt('reputation')+' '+rep+' / 10';$('#served').textContent=served+' '+txt('orders');$('#bar').style.width=rep*10+'%';$('#serve').innerHTML=txt('serve')+'<small>+'+reward()+' '+txt('price')+'</small>';$('#upgrade').innerHTML=txt('upgrade')+'<small>'+costUpgrade()+' '+txt('price')+'</small>';$('#hire').innerHTML=txt('hire')+'<small>'+(helpers>=3?'MAX':costHire()+' '+txt('price'))+'</small>';$('#hint').textContent=txt('hint');$('#lang').textContent=ar?'English':'العربية';$('#upgrade').disabled=money<costUpgrade();$('#hire').disabled=money<costHire()||helpers>=3;$('#serve').disabled=customers.length===0}function notify(message){$('#toast').textContent=message;$('#toast').style.opacity='1';toastTimer=2}function spawn(){if(customers.length>=4)return;customers.push({x:-35,y:0,shirt:['#f28d7a','#8e9acb','#e5b35e','#77b9aa'][Math.floor(Math.random()*4)],skin:['#edb68e','#c88865','#a86e4e'][Math.floor(Math.random()*3)],mood:Math.random()*6.28})}function confetti(){for(let i=0;i<13;i++)particles.push({x:W*.52,y:H*.48,vx:(Math.random()-.5)*160,vy:-Math.random()*150-30,t:1,c:['#e8a044','#f48e65','#60c0ab'][i%3]})}function serve(){if(!customers.length){notify(txt('empty'));return}customers.shift();money+=reward();served++;confetti();notify(txt('great')+reward());save();update()}$('#serve').onclick=serve;$('#upgrade').onclick=()=>{if(money<costUpgrade()){notify(txt('need'));return}money-=costUpgrade();upgrades++;notify(txt('improved'));save();update()};$('#hire').onclick=()=>{if(helpers>=3){notify(txt('full'));return}if(money<costHire()){notify(txt('need'));return}money-=costHire();helpers++;notify(txt('helper'));save();update()};$('#lang').onclick=()=>{ar=!ar;save();update()};function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',resize);function rect(x,y,w,h,c,r=0){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function label(s,x,y,size=14,c='#28423e',align='center'){ctx.font='900 '+size+'px system-ui';ctx.fillStyle=c;ctx.textAlign=align;ctx.fillText(s,x,y)}function person(x,y,shirt,skin,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='#507e6740';ctx.beginPath();ctx.ellipse(0,27,22,8,0,0,7);ctx.fill();rect(-13,0,26,27,shirt,8);rect(-12,20,9,14,'#3f6e78',3);rect(3,20,9,14,'#3f6e78',3);circle(0,-12,15,skin);ctx.fillStyle='#48372e';ctx.beginPath();ctx.arc(0,-17,15,Math.PI,Math.PI*2);ctx.fill();circle(-5,-11,1.6,'#2c3330');circle(5,-11,1.6,'#2c3330');ctx.restore()}function draw(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;clock+=dt;autoClock+=dt;toastTimer-=dt;if(toastTimer<=0)$('#toast').style.opacity='0';if(customers.length<3&&clock>2.7){clock=0;spawn();update()}if(helpers&&autoClock>Math.max(1.2,5-helpers*1.15)){autoClock=0;if(customers.length)serve()}ctx.clearRect(0,0,W,H);const s=Math.min(W/390,H/590);ctx.save();ctx.translate(W/2,H/2);ctx.scale(s,s);ctx.translate(-195,-295);const oldW=W,oldH=H;W=390;H=590;rect(0,0,390,590,'#cde8c7');rect(0,0,390,205,'#aee0dd');circle(323,70,34,'#ffdf92');for(let i=0;i<5;i++){circle(i*96-12,208,54,'#7bc49b');circle(i*96+24,192,49,'#86cda2')}rect(0,355,390,235,'#ead7b8');for(let i=0;i<9;i++){rect(i*50-30,400,29,6,'#d9c5a5',4);rect(i*50,510,29,6,'#d9c5a5',4)}rect(48,170,294,225,'#3c857a',18);rect(65,188,260,155,'#fff1d3',11);rect(80,212,230,117,'#f4c58d',8);rect(50,157,290,50,'#fa9667',12);for(let i=0;i<6;i++)rect(52+i*48,183,47,26,i%2?'#fff2d6':'#f9b07f',4);rect(115,125,160,45,'#fff7e6',13);label('MINI BITES',195,154,22,'#36776e');rect(70,322,250,61,'#fff5df',10);rect(86,340,218,9,'#b5d6b7',5);rect(137,271,116,50,'#88bca4',7);rect(151,283,88,26,'#e8f6d7',4);label('🍔',195,303,22);person(192,267,'#f8aa67','#dc9974',.85);for(let i=0;i<helpers;i++)person(115+i*83,296,'#77b9aa','#edb68e',.52);label(txt('ready'),195,77,17,'#316a62');customers.forEach((c,i)=>{const targetX=102+i*64;c.x+=(targetX-c.x)*Math.min(1,dt*3);person(c.x,432+Math.sin(t/400+c.mood)*2,c.shirt,c.skin,.9);rect(c.x-25,370,50,31,'#fff9eb',13);label('🍔',c.x,392,20)});particles=particles.filter(p=>p.t>0);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt;p.t-=dt;circle(p.x,p.y,4,p.c)});W=oldW;H=oldH;ctx.restore();requestAnimationFrame(draw)}resize();spawn();update();requestAnimationFrame(draw)})();
</script></body></html>
