*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#101e30;color:white;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}button{font:inherit;cursor:pointer;border:0}#app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;background:#172638;overflow:hidden}header{padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#172638}.logo{font-weight:1000;font-size:19px;letter-spacing:-.8px}.logo b{color:#ffd37b}.sub{font-size:10px;color:#9bb1c3;font-weight:800;letter-spacing:2px}.wallet{border-radius:17px;background:#2a3d50;border:1px solid #466073;padding:9px 12px;font-weight:900}.wallet span{color:#ffd36f}.world{flex:1;min-height:0;position:relative;background:linear-gradient(#7cbdda,#e3d5b6 76%);overflow:hidden}.world svg{width:100%;height:100%;display:block}.bubble{position:absolute;left:50%;top:8%;transform:translateX(-50%);background:white;color:#31485a;border-radius:20px;padding:10px 16px;font-size:13px;font-weight:900;box-shadow:0 7px 0 #0002;white-space:nowrap}.bubble:after{content:"";position:absolute;bottom:-9px;left:45%;border-left:10px solid transparent;border-right:10px solid transparent;border-top:10px solid white}.float{position:absolute;left:50%;top:55%;color:#fff59a;font-size:26px;font-weight:1000;text-shadow:0 3px #846342;animation:up 1s forwards;pointer-events:none}@keyframes up{to{transform:translateY(-90px);opacity:0}}.bottom{padding:13px 15px calc(env(safe-area-inset-bottom) + 15px);background:#172638;border-top:1px solid #31485c}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}.status{font-size:12px;color:#bdd2df;font-weight:750}.stars{color:#ffd27a;font-weight:900}.serve{width:100%;background:linear-gradient(135deg,#ffca68,#ff925f);color:#452e30;font-size:19px;font-weight:1000;padding:17px;border-radius:20px;box-shadow:0 5px 0 #a95244;transition:transform .1s}.serve:active{transform:translateY(4px);box-shadow:0 1px 0 #a95244}.serve:disabled{opacity:.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.action{background:#293f54;color:#fff;border:1px solid #49647b;padding:12px 8px;border-radius:16px;min-height:77px;text-align:center}.action strong{display:block;font-size:13px}.action small{display:block;color:#ffd68c;margin-top:4px;font-weight:850}.action:disabled{opacity:.5}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:11px;color:#9bb1c3}.lang{background:#344d63;color:#fff;border-radius:12px;padding:7px 10px;font-weight:800}.progress{height:7px;border-radius:8px;background:#30495c;margin-top:10px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#fbd276,#f79b70);width:0;transition:width .3s}.walk{animation:bob 1.7s ease-in-out infinite alternate;transform-origin:center bottom}@keyframes bob{to{transform:translateY(-4px)}}.steam{animation:steam 2s infinite alternate;opacity:.7}@keyframes steam{to{transform:translateY(-12px);opacity:.15}}.glow{filter:drop-shadow(0 9px 10px #2e496344)}#toast{position:absolute;top:19%;left:50%;transform:translateX(-50%);background:#1c3c49;color:#fff;border-radius:14px;padding:10px 16px;font-weight:900;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none}
</style></head><body><main id="app"><header><div><div class="logo">MINI <b>VENTURES</b></div><div class="sub">LIVING CITY • ALPHA 0.2</div></div><div class="wallet">🪙 <span id="coins">0</span></div></header><section class="world" id="world"><svg viewBox="0 0 390 570" preserveAspectRatio="xMidYMid slice" aria-label="Illustrated animated food stall with customers"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#73bbdf"/><stop offset="1" stop-color="#f6e5b5"/></linearGradient><linearGradient id="front" x2="0" y2="1"><stop stop-color="#fbe6bb"/><stop offset="1" stop-color="#eeb77e"/></linearGradient><linearGradient id="roof" x2="0" y2="1"><stop stop-color="#fb987a"/><stop offset="1" stop-color="#d95c63"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4a6b64" flood-opacity=".25"/></filter></defs><rect width="390" height="570" fill="url(#sky)"/><circle cx="328" cy="80" r="38" fill="#fff2bc" opacity=".85"/><path d="M0 244Q80 190 150 244T390 229V570H0" fill="#92c8ac"/><path d="M0 299Q90 267 172 305T390 288V570H0" fill="#6fb7a0"/><g fill="#538f83"><rect x="12" y="173" width="54" height="117" rx="8"/><rect x="325" y="182" width="58" height="106" rx="8"/></g><g fill="#c2e9d5"><rect x="24" y="190" width="12" height="16" rx="3"/><rect x="44" y="190" width="12" height="16" rx="3"/><rect x="337" y="200" width="13" height="16" rx="3"/><rect x="358" y="200" width="13" height="16" rx="3"/></g><path d="M0 412L390 379V570H0" fill="#e7bd96"/><path d="M0 480L390 439" stroke="#f5d5ad" stroke-width="9"/><path d="M0 555L390 513" stroke="#f5d5ad" stroke-width="9"/><ellipse cx="197" cy="390" rx="169" ry="34" fill="#486e64" opacity=".2"/><g filter="url(#shadow)"><rect x="52" y="222" width="287" height="159" rx="16" fill="#e9a06d"/><rect x="68" y="242" width="256" height="121" rx="10" fill="url(#front)"/><rect x="91" y="251" width="210" height="78" rx="9" fill="#8cc6b6"/><path d="M43 226L65 167Q196 145 325 167L348 226Z" fill="url(#roof)"/><path d="M65 167H325L343 207H47Z" fill="#ffb18b"/><path d="M65 167H103L91 207H47ZM142 167H180L179 207H130ZM219 167H257L267 207H219ZM296 167H325L343 207H305Z" fill="#fff0d0"/><rect x="104" y="129" width="183" height="49" rx="16" fill="#2f6875" stroke="#fff2d4" stroke-width="5"/><text x="195" y="160" font-family="system-ui" font-weight="1000" font-size="23" fill="#fff4d6" text-anchor="middle">SUNNY BITES</text><rect x="49" y="329" width="294" height="60" rx="12" fill="#fff0d0"/><rect x="61" y="338" width="269" height="12" rx="6" fill="#f7c689"/><rect x="86" y="350" width="220" height="31" rx="7" fill="#e9b47f"/><rect x="119" y="275" width="151" height="54" rx="12" fill="#f8e6c8"/><rect x="130" y="283" width="130" height="36" rx="7" fill="#b6dbbc"/><text x="195" y="308" text-anchor="middle" font-size="26">🍔</text></g><g class="steam" stroke="#fff7dc" stroke-width="5" fill="none" stroke-linecap="round"><path d="M178 271Q163 260 180 248"/><path d="M205 269Q190 257 209 243"/></g><g id="chef" class="walk"><ellipse cx="195" cy="338" rx="25" ry="7" fill="#416f69" opacity=".2"/><path d="M177 297Q195 286 213 297L217 332H173Z" fill="#f7f5e7"/><rect x="182" y="323" width="11" height="17" rx="4" fill="#41556b"/><rect x="198" y="323" width="11" height="17" rx="4" fill="#41556b"/><circle cx="195" cy="281" r="17" fill="#d9986b"/><path d="M177 279Q173 260 192 260Q213 258 213 279Q201 266 188 270Z" fill="#4d3440"/><circle cx="189" cy="282" r="2" fill="#302b39"/><circle cx="201" cy="282" r="2" fill="#302b39"/><path d="M191 290Q196 294 201 289" fill="none" stroke="#9b514c" stroke-width="2" stroke-linecap="round"/><path d="M176 267Q170 252 184 251Q193 237 203 251Q221 249 214 267Z" fill="#fff8ea"/></g><g id="crowd"></g><g><circle cx="30" cy="390" r="17" fill="#5b9e84"/><circle cx="357" cy="389" r="19" fill="#5b9e84"/><circle cx="24" cy="373" r="18" fill="#74b78e"/><circle cx="359" cy="368" r="21" fill="#74b78e"/></g></svg><div class="bubble" id="bubble">🍔 Fresh orders are waiting!</div><div id="toast"></div></section><section class="bottom"><div class="topline"><span class="status" id="status">3 customers in line</span><span class="stars" id="level">⭐ Level 1</span></div><button class="serve" id="serve">🍔 SERVE CUSTOMER · +12 🪙</button><div class="actions"><button class="action" id="upgrade"><strong>🔥 Upgrade Kitchen</strong><small id="upgradeCost">🪙 80</small></button><button class="action" id="hire"><strong>👨‍🍳 Hire Assistant</strong><small id="hireCost">🪙 180</small></button></div><div class="progress"><div id="progress"></div></div><div class="meta"><span id="meta">Serve guests to grow your business</span><button class="lang" id="lang">العربية</button></div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),key='mini-ventures-living-v2';let s;try{s=JSON.parse(localStorage.getItem(key))}catch(e){}s=Object.assign({coins:0,served:0,kitchen:1,staff:0,ar:false},s||{});let queue=3,clock=0,auto=0,toastTimer=0;const T=(en,ar)=>s.ar?ar:en;const save=()=>{try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}};const costU=()=>80*s.kitchen*s.kitchen,costH=()=>180*(s.staff+1)*(s.staff+1),income=()=>12+8*(s.kitchen-1),level=()=>Math.floor(s.served/15)+1;
function visitor(i){const x=112+i*80,skins=['#b87550','#f0bb87','#9e6c53','#d99a6f'],shirts=['#745ec9','#ed837e','#5c9a8e','#d59b46'],hair=['#362a35','#624333','#292e46','#8a553d'];return '<g class="walk" style="animation-delay:'+i*.25+'s"><ellipse cx="'+x+'" cy="465" rx="23" ry="7" fill="#5b7772" opacity=".22"/><path d="M'+(x-17)+' 422Q'+x+' 412 '+(x+17)+' 422L'+(x+20)+' 451H'+(x-20)+'Z" fill="'+shirts[(s.served+i)%4]+'"/><rect x="'+(x-14)+'" y="445" width="12" height="20" rx="5" fill="#41506b"/><rect x="'+(x+3)+'" y="445" width="12" height="20" rx="5" fill="#41506b"/><circle cx="'+x+'" cy="404" r="20" fill="'+skins[(s.served+i)%4]+'"/><path d="M'+(x-19)+' 405Q'+(x-22)+' 380 '+x+' 381Q'+(x+23)+' 382 '+(x+19)+' 406Q'+(x+8)+' 389 '+(x-8)+' 394Z" fill="'+hair[(s.served+i)%4]+'"/><circle cx="'+(x-7)+'" cy="406" r="2.2" fill="#273442"/><circle cx="'+(x+7)+'" cy="406" r="2.2" fill="#273442"/><path d="M'+(x-5)+' 415Q'+x+' 419 '+(x+5)+' 415" fill="none" stroke="#8c4f4b" stroke-width="2" stroke-linecap="round"/></g>'}
function render(){$('coins').textContent=s.coins.toLocaleString();$('level').textContent=T('⭐ Level ','⭐ المستوى ')+level();$('status').textContent=T(queue+' customers in line','الزبائن في الطابور: '+queue);$('serve').textContent=T('🍔 SERVE CUSTOMER · +','🍔 خدمة زبون · +')+income()+' 🪙';$('serve').disabled=queue===0;$('upgrade').firstElementChild.textContent=T('🔥 Upgrade Kitchen','🔥 تطوير المطبخ');$('hire').firstElementChild.textContent=T('👨‍🍳 Hire Assistant','👨‍🍳 توظيف مساعد');$('upgradeCost').textContent='🪙 '+costU();$('hireCost').textContent='🪙 '+costH();$('upgrade').disabled=s.coins<costU();$('hire').disabled=s.coins<costH();$('lang').textContent=s.ar?'English':'العربية';$('bubble').textContent=T('🍔 Fresh orders are waiting!','🍔 طلبات طازجة بانتظارك!');$('meta').textContent=T('Kitchen Lv. '+s.kitchen+' · Staff '+s.staff+' · Served '+s.served,'المطبخ '+s.kitchen+' · الموظفين '+s.staff+' · الطلبات '+s.served);$('progress').style.width=(s.served%15)/15*100+'%';$('crowd').innerHTML=Array.from({length:queue},(_,i)=>visitor(i)).join('')}
function pop(msg){$('toast').textContent=msg;$('toast').style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.opacity=0,1100)}
function serve(){if(queue<1)return;queue--;s.coins+=income();s.served++;save();render();const f=document.createElement('div');f.className='float';f.textContent='+'+income()+' 🪙';$('world').appendChild(f);setTimeout(()=>f.remove(),1000);if(s.served%15===0)pop(T('New level unlocked! ⭐','مستوى جديد! ⭐'))}
$('serve').onclick=serve;$('upgrade').onclick=()=>{if(s.coins<costU())return;s.coins-=costU();s.kitchen++;save();render();pop(T('Kitchen upgraded!','تم تطوير المطبخ!'))};$('hire').onclick=()=>{if(s.coins<costH())return;s.coins-=costH();s.staff++;save();render();pop(T('New teammate hired!','تم توظيف مساعد!'))};$('lang').onclick=()=>{s.ar=!s.ar;save();render()};let prev=performance.now();function loop(now){const dt=Math.min(.1,(now-prev)/1000);prev=now;clock+=dt;auto+=dt;if(clock>2.7&&queue<3){queue++;clock=0;render()}if(s.staff>0&&auto>Math.max(1.2,5-s.staff*.8)){auto=0;if(queue)serve()}requestAnimationFrame(loop)}render();requestAnimationFrame(loop)})();
</script></body></html>
