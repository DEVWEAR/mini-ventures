div><section id="overlay" class="overlay"><div class="panel" id="panel"></div></section></main><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id),overlay=$('overlay'),panel=$('panel');const KEY='astra-drift-save-v1';let data={bank:0,best:0,games:0,shield:0,magnet:0,bonus:0,lang:'en',sound:true,highCombo:0,skin:'nova',ownedSkins:['nova'],totalStars:0,bosses:0};try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&typeof d==='object')data={...data,...d}}catch(e){}const tr=(en,ar)=>data.lang==='ar'?ar:en;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};let W=390,H=780,dpr=1,mode='menu',last=0,elapsed=0,score=0,runCoins=0,lives=3,sector=1,invuln=0,shieldCharges=0,spawn=0,objects=[],particles=[],stars=[],player={x:195,y:660,r:17},dragging=false,flash=0,shake=0,notice='',noticeTime=0,audio=null,missionTarget=30,combo=0,comboTimer=0,warp=0,scoreRemainder=0,bossSpawnedFor=0,runBosses=0,runPickups=0,shots=[],fireClock=0;const rand=(a,b)=>a+Math.random()*(b-a);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function beep(freq=520,duration=.09,type='sine'){if(!data.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}function resize(){const r=canvas.getBoundingClientRect();W=r.width||390;H=r.height||780;dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);player.y=H*.78;player.x=clamp(player.x,28,W-28);if(!stars.length)stars=Array.from({length:85},()=>({x:rand(0,W),y:rand(0,H),r:rand(.5,2),speed:rand(10,60)}))}window.addEventListener('resize',resize);resize();function show(html){overlay.classList.remove('hidden');panel.innerHTML=html}function hide(){overlay.classList.add('hidden')}function btn(label,fn,secondary=false){return '<button class="btn'+(secondary?' secondary':'')+'" data-action="'+fn+'">'+label+'</button>'}function menu(){mode='menu';$('hud').classList.add('hidden');$('control').classList.add('hidden');show('<div class="title-icon">✦</div><div class="eyebrow">A NEW ARCADE ADVENTURE</div><div class="logo">ASTRA<br>DRIFT</div><div class="desc">'+tr('Pilot a glowing starship through a shifting cosmic highway. Dodge hazards, grab starlight, survive increasingly wild sectors.','قد مركبتك الفضائية في طريق كوني متغير. تفادَ العقبات، واجمع النجوم، واصمد في مراحل تزداد صعوبة.')+'</div><div class="stats"><div class="stat"><strong>'+data.best+'</strong><span>'+tr('BEST SCORE','أفضل نتيجة')+'</span></div><div class="stat"><strong>✦ '+data.bank+'</strong><span>'+tr('STAR BANK','رصيد النجوم')+'</span></div><div class="stat"><strong>'+data.games+'</strong><span>'+tr('FLIGHTS','الرحلات')+'</span></div></div>'+btn(tr('▶ START FLIGHT','▶ ابدأ الرحلة'),'start')+btn(tr('✦ SHIP UPGRADES','✦ تطوير المركبة'),'shop',true)+btn(tr('🚀 SHIP GARAGE','🚀 معرض المركبات'),'garage',true)+btn(tr('🎯 MISSIONS & REWARDS','🎯 المهام والمكافآت'),'missions',true)+'<div class="row">'+btn(data.lang==='en'?'العربية':'English','lang',true)+btn(data.sound?'🔊 '+tr('Sound','الصوت'):'🔇 '+tr('Muted','صامت'),'sound',true)+'</div><div class="tip">'+tr('Drag to steer and auto-fire at enemy fighters. Destroy flagship bosses. Progress is saved on this device.','اسحب للتحكم بالمركبة وإطلاق النار تلقائياً على طائرات العدو. يتم حفظ التقدم على هذا الجهاز.')+'</div>')}function shop(){mode='shop';const items=[['shield','🛡️ '+tr('Extra Shield','درع إضافي'),tr('Start each run with more protection','حماية إضافية في بداية كل رحلة')],['magnet','🧲 '+tr('Star Magnet','مغناطيس النجوم'),tr('Collect stars from farther away','اجمع النجوم من مسافة أبعد')],['bonus','⚡ '+tr('Star Bonus','مضاعف النجوم'),tr('Earn more stars per pickup','اكسب نجوماً أكثر لكل نجمة')]];let html='<div class="eyebrow">'+tr('SHIP HANGAR','حظيرة المركبات')+'</div><div class="logo" style="font-size:32px">'+tr('UPGRADES','التطويرات')+'</div><div class="desc">✦ '+data.bank+' '+tr('available stars','نجمة متاحة')+'</div><div class="shop">';items.forEach(([key,name,desc])=>{const lv=clamp(data[key]||0,0,3),cost=20*(lv+1)*(lv+1);html+='<div class="upgrade"><div><b>'+name+' · '+lv+'/3</b><small>'+desc+'</small></div><button data-action="buy-'+key+'" '+(lv>=3||data.bank<cost?'disabled':'')+'>'+(lv>=3?tr('MAX','مكتمل'):'✦ '+cost)+'</button></div>'});html+='</div>'+btn(tr('← BACK','← رجوع'),'menu',true);show(html)}function garage(){mode='garage';const skins=[['nova','💠 NOVA',tr('Original explorer','مركبة الاستكشاف'),0],['ember','🔥 EMBER',tr('Flame-red interceptor','مركبة حمراء نارية'),120],['royal','💜 ROYAL',tr('Violet star racer','مركبة بنفسجية'),250],['gold','🌟 GOLD',tr('Golden champion','المركبة الذهبية'),500]];let html='<div class="eyebrow">'+tr('CUSTOMIZE YOUR SHIP','خصص مركبتك')+'</div><div class="logo" style="font-size:31px">'+tr('SHIP GARAGE','معرض المركبات')+'</div><div class="desc">✦ '+data.bank+' '+tr('stars available','نجمة متاحة')+'</div>';for(const [key,name,desc,cost] of skins){const owned=(data.ownedSkins||['nova']).includes(key),selected=data.skin===key;html+='<div class="skin-card"><div><b>'+name+'</b><small>'+desc+'</small></div><button data-action="skin-'+key+'" '+(selected||(!owned&&data.bank<cost)?'disabled':'')+'>'+(selected?tr('EQUIPPED','مجهزة'):owned?tr('EQUIP','استخدم'):'✦ '+cost)+'</button></div>'}html+=btn(tr('← BACK','← رجوع'),'menu',true);show(html)}function missions(){mode='missions';const goals=[{n:tr('Star Collector','جامع النجوم'),v:data.totalStars||0,goal:100},{n:tr('Veteran Pilot','الطيار المحترف'),v:data.games,goal:10},{n:tr('Boss Hunter','صائد الزعماء'),v:data.bosses||0,goal:3}];let html='<div class="eyebrow">'+tr('LONG-TERM CHALLENGES','تحديات طويلة المدى')+'</div><div class="logo" style="font-size:32px">'+tr('MISSIONS','المهام')+'</div>';for(const m of goals)html+='<div class="skin-card"><div><b>'+m.n+'</b><small>'+Math.min(m.goal,m.v)+' / '+m.goal+'</small></div><strong>✦</strong></div>';html+='<div class="offer"><strong>✨ '+tr('OPTIONAL COSMETIC PASS — CONCEPT','باقة مظهر اختيارية — فكرة')+'</strong><p>'+tr('Future idea: exclusive ship colors, trails and visual effects. No gameplay advantage.','فكرة مستقبلية: ألوان مركبات حصرية وآثار حركة ومؤثرات شكلية فقط، بدون أفضلية في اللعب.')+'</p><div class="disclaimer">'+tr('NOT FOR SALE: payments are not connected. No real-money purchase is possible here.','غير معروضة للبيع: نظام الدفع غير مربوط، ولا توجد مشتريات مالية حالياً.')+'</div></div>';html+=btn(tr('← BACK','← رجوع'),'menu',true);show(html)}function start(){mode='play';hide();$('hud').classList.remove('hidden');$('control').classList.remove('hidden');elapsed=0;score=0;runCoins=0;lives=3;sector=1;invuln=1.5;combo=0;comboTimer=0;warp=0;scoreRemainder=0;$('comboHud').classList.add('hidden');$('powerHud').classList.add('hidden');shieldCharges=data.shield;spawn=.6;objects=[];particles=[];flash=0;shake=0;missionTarget=30;bossSpawnedFor=0;runBosses=0;runPickups=0;shots=[];fireClock=0;player.x=W/2;player.y=H*.78;updateHud();banner(tr('SECTOR 1','المرحلة 1'));beep(670,.13)}function updateHud(){$('score').textContent=score;$('scoreLabel').textContent=tr('SCORE','النقاط');$('sectorLabel').textContent=tr('SECTOR ','المرحلة ')+sector;$('lives').textContent='❤'.repeat(Math.max(0,lives))+(shieldCharges?' 🛡️'+shieldCharges:'');$('runCoins').textContent=runCoins}function banner(t){$('banner').textContent=t;$('banner').classList.add('show');noticeTime=1.5}function pause(){if(mode!=='play')return;mode='paused';show('<div class="title-icon">Ⅱ</div><div class="logo" style="font-size:35px">'+tr('PAUSED','إيقاف مؤقت')+'</div><div class="desc">'+tr('Your starship is safe while paused.','مركبتك بأمان أثناء الإيقاف.')+'</div>'+btn(tr('▶ RESUME','▶ متابعة'),'resume')+btn(tr('↩ MAIN MENU','↩ القائمة الرئيسية'),'quit',true))}function finish(){mode='over';data.games++;data.bank+=runCoins;data.totalStars=(data.totalStars||0)+runPickups;data.bosses=(data.bosses||0)+runBosses;data.best=Math.max(data.best,score);data.highCombo=Math.max(data.highCombo||0,combo);save();$('comboHud').classList.add('hidden');$('powerHud').classList.add('hidden');$('control').classList.add('hidden');$('hud').classList.add('hidden');show('<div class="title-icon">🌠</div><div class="eyebrow">'+tr('FLIGHT COMPLETE','انتهت الرحلة')+'</div><div class="logo" style="font-size:35px">'+tr('NICE RUN!','رحلة رائعة!')+'</div><div class="stats"><div class="stat"><strong>'+score+'</strong><span>'+tr('SCORE','النقاط')+'</span></div><div class="stat"><strong>✦ '+runCoins+'</strong><span>'+tr('EARNED','المكتسب')+'</span></div><div class="stat"><strong>'+sector+'</strong><span>'+tr('SECTOR','المرحلة')+'</span></div></div><div class="desc">'+tr('Your collected stars are now in the ship bank. Upgrade and fly again!','نجومك انضافت لرصيد المركبة. طورها وحاول مرة ثانية!')+'</div>'+btn(tr('↻ PLAY AGAIN','↻ العب مرة ثانية'),'start')+btn(tr('✦ UPGRADES','✦ التطويرات'),'shop',true)+btn(tr('⌂ MAIN MENU','⌂ الرئيسية'),'menu',true));beep(230,.28,'triangle')}panel.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='start')start();else if(a==='menu'||a==='quit')menu();else if(a==='shop')shop();else if(a==='garage')garage();else if(a==='missions')missions();else if(a.startsWith('skin-')){const key=a.slice(5),cost={nova:0,ember:120,royal:250,gold:500}[key];if(cost===undefined)return;data.ownedSkins=data.ownedSkins||['nova'];if(!data.ownedSkins.includes(key)){if(data.bank<cost)return;data.bank-=cost;data.ownedSkins.push(key)}data.skin=key;save();beep(760,.1);garage();}else if(a==='resume'){mode='play';hide()}else if(a==='lang'){data.lang=data.lang==='en'?'ar':'en';save();menu()}else if(a==='sound'){data.sound=!data.sound;save();menu()}else if(a.startsWith('buy-')){const k=a.slice(4),lv=clamp(data[k]||0,0,3),cost=20*(lv+1)*(lv+1);if(lv<3&&data.bank>=cost){data.bank-=cost;data[k]=lv+1;save();beep(750,.12);shop()}}});$('pauseBtn').onclick=pause;function point(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{if(mode!=='play')return;dragging=true;player.x=clamp(point(e).x,22,W-22);try{canvas.setPointerCapture(e.pointerId)}catch(_){}});canvas.addEventListener('pointermove',e=>{if(dragging&&mode==='play')player.x=clamp(point(e).x,22,W-22)});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);window.addEventListener('keydown',e=>{if(mode==='play'&&(e.key==='ArrowLeft'||e.key==='a'))player.x=clamp(player.x-32,22,W-22);if(mode==='play'&&(e.key==='ArrowRight'||e.key==='d'))player.x=clamp(player.x+32,22,W-22);if(e.key==='Escape'){if(mode==='play')pause();else if(mode==='paused'){mode='play';hide()}}});function burst(x,y,color,count=12){for(let i=0;i<count;i++)particles.push({x,y,vx:rand(-145,145),vy:rand(-145,145),life:rand(.35,.75),max:.75,color,r:rand(2,5)})}function spawnObject(){const hazard=Math.random()<Math.min(.58,.29+sector*.045);const x=rand(31,W-31);objects.push({x,y:-45,type:hazard?'enemy':Math.random()<.07?'warp':Math.random()<.10?'heart':'star',r:hazard?rand(16,25):14,hp:hazard?2:0,spin:rand(0,6),speed:rand(0,55)});if(sector>=3&&Math.random()<.19)objects.push({x:clamp(x+rand(-100,100),28,W-28),y:-105,type:'enemy',r:rand(15,23),hp:2,spin:rand(0,6),speed:rand(0,55)})}function step(dt){elapsed+=dt;fireClock-=dt;if(fireClock<=0){fireClock=.2;shots.push({x:player.x-9,y:player.y-20},{x:player.x+9,y:player.y-20})}for(let i=shots.length-1;i>=0;i--){const b=shots[i];b.y-=650*dt;if(b.y< -20){shots.splice(i,1);continue}for(let j=objects.length-1;j>=0;j--){const o=objects[j];if((o.type==='enemy'||o.type==='boss')&&Math.hypot(o.x-b.x,o.y-b.y)<o.r+5){shots.splice(i,1);o.hp--;burst(o.x,o.y,'#ff99ad',3);if(o.hp<=0){objects.splice(j,1);score+=o.type==='boss'?500:50;runCoins+=o.type==='boss'?30:2;if(o.type==='boss'){runBosses++;banner(tr('FLAGSHIP DESTROYED!','دمرت سفينة العدو!'))}burst(o.x,o.y,'#ffb18b',20);beep(450,.12)}break}}}comboTimer=Math.max(0,comboTimer-dt);warp=Math.max(0,warp-dt);if(comboTimer<=0&&combo>0){combo=0;$('comboHud').classList.add('hidden')}if(warp<=0)$('powerHud').classList.add('hidden');else $('powerHud').textContent='❄️ '+tr('TIME WARP','تباطؤ الزمن')+' '+Math.ceil(warp)+'s';invuln=Math.max(0,invuln-dt);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt);const newSector=clamp(1+Math.floor(elapsed/24),1,9);if(newSector!==sector){sector=newSector;banner(tr('SECTOR ','المرحلة ')+sector+' ⚡');beep(820,.2);updateHud()}if(sector>=3&&sector%3===0&&bossSpawnedFor!==sector){bossSpawnedFor=sector;objects.push({x:W/2,y:-80,type:'boss',r:38,spin:0,speed:-65,phase:rand(0,6.28),hp:14});banner(tr('⚠ ENEMY FLAGSHIP!','⚠ سفينة العدو!'));beep(170,.35,'sawtooth')}spawn-=dt;if(spawn<=0){spawnObject();spawn=Math.max(.28,.88-sector*.065)*rand(.78,1.18)}const speed=(170+sector*27)*(warp>0?.55:1);for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.y+=(speed+o.speed)*dt;o.spin+=dt*2;if(o.type==='boss')o.x=clamp(W/2+Math.sin(elapsed*2.1+o.phase)*W*.32,45,W-45);if(o.y>H+45){if(o.type==='boss'){banner(tr('FLAGSHIP ESCAPED!','سفينة العدو هربت!'))}objects.splice(i,1);continue}const dist=Math.hypot(o.x-player.x,o.y-player.y);if(o.type==='star'&&data.magnet&&dist<55+data.magnet*22){o.x+=(player.x-o.x)*Math.min(1,dt*6);o.y+=(player.y-o.y)*Math.min(1,dt*6)}if(dist<o.r+player.r-5){objects.splice(i,1);if(o.type==='enemy'||o.type==='boss'){combo=0;comboTimer=0;$('comboHud').classList.add('hidden');if(invuln>0)continue;if(shieldCharges>0){shieldCharges--;banner(tr('SHIELD SAVED YOU!','الدرع حماك!'))}else{lives--;flash=.25;shake=.3;banner(tr('OUCH!','انتبه!'))}invuln=1.6;burst(o.x,o.y,'#ff748e',18);beep(180,.18,'sawtooth');updateHud();if(lives<=0){finish();return}}else if(o.type==='warp'){warp=6;$('powerHud').classList.remove('hidden');burst(o.x,o.y,'#7bdbff',17);banner(tr('TIME WARP!','تباطؤ الزمن!'));beep(880,.22);updateHud()}else if(o.type==='heart'){lives=Math.min(5,lives+1);burst(o.x,o.y,'#ff8ca8',12);beep(690,.15);updateHud()}else{runPickups++;combo++;comboTimer=3.5;const multiplier=Math.min(5,1+Math.floor(combo/5));const gain=(1+data.bonus)*multiplier;runCoins+=gain;score+=(10*gain+sector);if(combo>=3){$('comboHud').classList.remove('hidden');$('comboHud').textContent='⚡ '+tr('COMBO','سلسلة')+' '+combo+' · x'+multiplier}if(combo%10===0){banner(tr('SUPER COMBO!','سلسلة خارقة!')+' x'+multiplier);beep(980,.12)}data.highCombo=Math.max(data.highCombo||0,combo);burst(o.x,o.y,'#ffe6a2',9);beep(540+Math.min(400,runCoins*6),.055);if(runCoins>=missionTarget){runCoins+=10;missionTarget+=30;banner(tr('STAR BONUS +10!','مكافأة نجوم +10!'))}updateHud()}}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.98;p.vy*=.98;if(p.life<=0)particles.splice(i,1)}scoreRemainder+=dt*15;const inc=Math.floor(scoreRemainder);if(inc){score+=inc;scoreRemainder-=inc}updateHud()}function drawShip(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);if(invuln>0&&mode==='play'&&Math.floor(elapsed*13)%2===0)ctx.globalAlpha=.48;ctx.shadowBlur=24;const colors={nova:['#60f3ef','#65d9f0'],ember:['#ff9d66','#ff725c'],royal:['#bf8cff','#9e80f9'],gold:['#ffdf72','#ffd073']};const palette=colors[data.skin]||colors.nova;ctx.shadowColor=palette[0];ctx.fillStyle=palette[1];ctx.beginPath();ctx.moveTo(0,-27);ctx.lineTo(19,18);ctx.lineTo(6,11);ctx.lineTo(0,17);ctx.lineTo(-6,11);ctx.lineTo(-19,18);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#142f58';ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(8,7);ctx.lineTo(-8,7);ctx.closePath();ctx.fill();ctx.fillStyle='#fff2c1';ctx.beginPath();ctx.ellipse(0,-5,4,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff9d77';ctx.beginPath();ctx.moveTo(-8,16);ctx.lineTo(-4,16+rand(9,20));ctx.lineTo(0,16);ctx.lineTo(4,16+rand(9,20));ctx.lineTo(8,16);ctx.fill();if(shieldCharges>0){ctx.strokeStyle='#a2fff4';ctx.lineWidth=2;ctx.globalAlpha=.65;ctx.beginPath();ctx.arc(0,0,33,0,Math.PI*2);ctx.stroke()}ctx.restore()}function draw(t){ctx.clearRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate(rand(-5,5),rand(-5,5));const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0a1638');bg.addColorStop(.5,'#171d46');bg.addColorStop(1,'#321b52');ctx.fillStyle=bg;ctx.fillRect(-10,-10,W+20,H+20);ctx.globalAlpha=.17;ctx.fillStyle='#956df6';ctx.beginPath();ctx.ellipse(W*.8,H*.3,125,260,-.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4bc9d2';ctx.beginPath();ctx.ellipse(W*.13,H*.73,90,240,.3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;for(const s of stars){const yy=(s.y+t*s.speed*.024)%H;ctx.fillStyle='rgba(209,240,255,'+(.35+.5*Math.sin(t*.001+s.x))+')';ctx.beginPath();ctx.arc(s.x,yy,s.r,0,Math.PI*2);ctx.fill()}ctx.strokeStyle='#62bce627';ctx.lineWidth=1;const shift=t*.045%68;for(let x=W*.15;x<W;x+=W*.35){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=-68+shift;y<H;y+=68){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}if(mode==='play'||mode==='paused'){for(const o of objects){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.spin);if(o.type==='star'){ctx.shadowColor='#ffdf85';ctx.shadowBlur=20;ctx.fillStyle='#ffe7a4';ctx.beginPath();for(let j=0;j<10;j++){const a=j*Math.PI/5-Math.PI/2,r=j%2?7:17;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill()}else if(o.type==='heart'||o.type==='warp'){ctx.font='30px system-ui';ctx.textAlign='center';ctx.fillText(o.type==='warp'?'❄':'❤',0,10)}else{ctx.shadowColor=o.type==='boss'?'#ffb36a':'#ff6499';ctx.shadowBlur=o.type==='boss'?28:17;ctx.fillStyle=o.type==='boss'?'#a35379':'#ed588c';ctx.strokeStyle=o.type==='boss'?'#ffdd9c':'#ffb6d2';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,o.r);ctx.lineTo(-o.r*.4,0);ctx.lineTo(-o.r,-o.r*.45);ctx.lineTo(-o.r*.42,-o.r*.3);ctx.lineTo(0,-o.r);ctx.lineTo(o.r*.42,-o.r*.3);ctx.lineTo(o.r,-o.r*.45);ctx.lineTo(o.r*.4,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#302047';ctx.fillRect(-o.r*.28,-o.r*.22,o.r*.56,o.r*.32);ctx.fillStyle='#fff0bc';ctx.fillRect(-o.r*.12,-o.r*.19,o.r*.24,o.r*.25);if(o.type==='boss'){ctx.fillStyle='#3c2747';ctx.fillRect(-o.r,-o.r-15,o.r*2,5);ctx.fillStyle='#ffca77';ctx.fillRect(-o.r,-o.r-15,o.r*2*Math.max(0,o.hp/14),5)}}ctx.restore()}for(const b of shots){ctx.shadowColor='#7fffea';ctx.shadowBlur=12;ctx.fillStyle='#9cfff6';ctx.fillRect(b.x-2,b.y-13,4,17)}ctx.shadowBlur=0;drawShip(player.x,player.y);for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.r,p.r)}ctx.globalAlpha=1;if(flash>0){ctx.fillStyle='#ff597a55';ctx.fillRect(0,0,W,H)}}else{drawShip(W/2,H*.59,1.8)}ctx.restore()}function frame(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;if(mode==='play')step(dt);draw(t);if(noticeTime>0){if(mode==='play')noticeTime-=dt;if(noticeTime<=0)$('banner').classList.remove('show')}requestAnimationFrame(frame)}menu();requestAnimationFrame(frame)})();
