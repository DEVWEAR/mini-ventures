const products=catalog.filter(p=>p.id>=10);let language=localStorage.getItem('micro-uae-lang')==='ar'?'ar':'en';const grid=document.getElementById('grid');function draw(){document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';document.querySelectorAll('.back-icon').forEach(a=>{a.setAttribute('aria-label',language==='ar'?'العودة للرئيسية':'Back to home');a.setAttribute('title',language==='ar'?'الرئيسية':'Home')});document.getElementById('toggle').textContent=language==='ar'?'English':'العربية';document.getElementById('home').textContent=language==='ar'?'الرئيسية':'Home';document.getElementById('other').textContent=language==='ar'?'الفلاتر':'Filters';document.getElementById('title').textContent=language==='ar'?'الأدوات':'Tools';document.getElementById('subtitle').textContent=language==='ar'?'أدوات القهوة وملحقاتها':'Coffee tools and accessories';grid.replaceChildren();for(const p of products){const card=document.createElement('article');card.className='card';const photo=document.createElement('div');photo.className='photo';const img=document.createElement('img');img.src=p.img;img.alt=p.en;img.loading='lazy';photo.append(img);const info=document.createElement('div');info.className='info';const h=document.createElement('h2');h.textContent=p[language];const select=document.createElement('select');select.setAttribute('aria-label',language==='ar'?'اختر المقاس':'Select size');p.variants.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v[0];select.append(o)});const price=document.createElement('div');price.className='price';function update(){price.textContent=p.variants[Number(select.value)][1]+' '+(language==='ar'?'درهم':'AED');if(p.images)img.src=p.images[Math.min(Number(select.value),p.images.length-1)]}select.onchange=update;update();const btn=document.createElement('button');btn.className='more';btn.textContent=language==='ar'?'عرض التفاصيل':'View details';btn.onclick=()=>{document.getElementById('detailTitle').textContent=p[language];const photos=document.getElementById('detailPhotos');photos.replaceChildren();for(const src of p.images||[p.img]){const im=document.createElement('img');im.src=src;im.alt=p.en;photos.append(im)}document.getElementById('detailVariant').textContent=p.variants[Number(select.value)][0]+' — '+price.textContent;document.getElementById('detailNote').textContent=language==='ar'?'الطلب والدفع غير مفعّلين حالياً.':'Ordering and payment are not enabled yet.';document.getElementById('detail').showModal()};info.append(h,select,price,btn);card.append(photo,info);grid.append(card)}}document.getElementById('toggle').onclick=()=>{language=language==='en'?'ar':'en';localStorage.setItem('micro-uae-lang',language);draw()};draw();</script></body></html>
